# RESEND_API_KEY は wrangler secret put で別途登録 (オーナー作業 — Resend 管理画面で発行)
# EMAIL_UNSUBSCRIBE_HMAC_KEY は wrangler secret put で登録済 (2026-04-30)

# Cloudflare分散レート制限（全エッジロケーションで共有、in-memoryより堅牢）
[[ratelimits]]
name = "WEBHOOK_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 300
  period = 60
