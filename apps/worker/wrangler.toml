name = "naturism-line-crm"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# Cloudflare 公式 Workers Observability (logs / invocations / errors を Cloudflare コンソールで保存・検索)
# Axiom + Discord (logger.ts) の前段として、24時間より先のログ保持と異常率の可視化を提供。
# 詳細: https://developers.cloudflare.com/workers/observability/logs/workers-logs/
[observability]
enabled = true
head_sampling_rate = 1  # 100% sampling (個人事業主規模なら無料枠で十分)

# Workers AI binding
[ai]
binding = "AI"

# Static assets (LIFF pages) served by Workers Assets
# SPA fallback ensures all non-API paths serve index.html
[assets]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "naturism-line-crm"
database_id = "f736c7fa-1c19-4279-b03d-3af3a71b7fca"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "naturism-line-crm-images"

[triggers]
crons = ["*/5 * * * *"]

[vars]
ACCOUNT_NAME = "naturism"
AI_MODEL_PRIMARY = "@cf/qwen/qwen3-30b-a3b-fp8"
AI_MODEL_FALLBACK = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# AI_SYSTEM_PROMPT is set via: npx wrangler secret put AI_SYSTEM_PROMPT

# ============================================================
# Round 4: Email channel (Resend)
# ============================================================
# 送信元 (Resend で verify 済の subdomain を使用)
EMAIL_FROM = "naturism <noreply@mail.naturism-diet.com>"
# 返信先 (サポート問い合わせ用; 当面 noreply と同一にしておき、support@ メアド作成後に差し替え)
EMAIL_REPLY_TO = "support@naturism-diet.com"
# 配信停止リンクの base URL (HMAC token 付与は EmailRenderer 側で実施)
EMAIL_UNSUBSCRIBE_BASE_URL = "https://naturism-line-crm.katsu-7d5.workers.dev/email/unsubscribe"
# 法定フッター HTML (特定電子メール法準拠: 送信者名・住所・連絡先 必須)
EMAIL_LEGAL_FOOTER_HTML = """
<div style="font-size:11px;color:#888888;line-height:1.6;margin-top:24px;font-family:sans-serif;">
<p style="margin:4px 0;"><strong>株式会社ケンコーエクスプレス</strong>（naturism ブランド）</p>
<p style="margin:4px 0;">〒103-0028 東京都中央区八重洲1-5-15 荘栄建物ビル5F</p>
<p style="margin:4px 0;">公式サイト: <a href="https://naturism-diet.com" style="color:#888888;text-decoration:underline;">naturism-diet.com</a>　｜　お問い合わせ: <a href="mailto:support@naturism-diet.com" style="color:#888888;text-decoration:underline;">support@naturism-diet.com</a></p>
<p style="margin:4px 0;font-size:10px;">本メールは naturism のお客様にお送りしています。</p>
</div>
"""
# 法定フッター text 版 (HTML 同等)
EMAIL_LEGAL_FOOTER_TEXT = """

---
株式会社ケンコーエクスプレス（naturism ブランド）
〒103-0028 東京都中央区八重洲1-5-15 荘栄建物ビル5F
公式サイト: https://naturism-diet.com
お問い合わせ: support@naturism-diet.com

本メールは naturism のお客様にお送りしています。
