name: Deploy Admin Web

# main への push で admin web (apps/web → Cloudflare Pages: naturism-admin) を自動デプロイ。
# CI workflow (typecheck + test) が通った場合のみ走る (deploy-worker.yml と同型)。
#
# 背景 (2026-07-26): naturism-admin.pages.dev は手動デプロイのみで運用され (最終 = 2026-06-15 の
# 手動再デプロイ 763da62b)、以後 API だけが進化して「開くと空のダッシュボード」に再び stale 化した。
# 恒久対策として起票された PR #126 が未 merge のまま残っていた。本 workflow はそれを置き換え、
# worker と同じ「main に入れば自動で最新」に揃えて腐る問題を根絶する。
#
# 必要な権限: CLOUDFLARE_API_TOKEN に Cloudflare Pages:Edit が必要。
# トークンが Workers 専用スコープの場合はこの job が権限エラーで落ちる → トークンに
# 「Cloudflare Pages: 編集」権限を追加する (アカウント: katsu-7d5)。
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

jobs:
  deploy-web:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared build

      - run: pnpm --filter web build
        env:
          # 管理画面が叩く worker API。repo 公開情報なので直書きで良いが、
          # 別環境で使う場合は GitHub Variables の NEXT_PUBLIC_API_URL が優先される。
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://naturism-line-crm.katsu-7d5.workers.dev' }}

      # output: 'export' なので apps/web/out が成果物。--branch=main で production 環境へ。
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy out --project-name=naturism-admin --branch=main

      # production branch 不一致の silent no-op を検出する (--branch がプロジェクトの production
      # branch と一致しない場合、job は success のまま preview に置かれ本番 URL が更新されない)。
      #
      # ⚠️ chunk 名ハッシュでの照合は使わない: 依存が変わらないビルドでは webpack runtime chunk が
      # 同名のままなので、**古い本番でも一致して素通りする**。2026-07-28 の初回運用で実際に
      # `webpack-….js` を拾って「Verified」と出しており、この step は何も検証していなかった
      # (幸い本番は正しく更新されていたが、それは偶然であって検証の結果ではない)。
      # commit SHA を成果物に焼き込み、本番がその SHA を配っているかで照合する。
      - name: Verify production serves this build
        run: |
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          # 照合対象は静的 HTML の <meta name="build-sha">。JS チャンク側にも同じ値が入るが、
          # 本番判定は「HTML を 1 本引いて grep」で完結させる (curl 1 回で済み、経路が短い)。
          if ! grep -q "build-sha\" content=\"$SHA_SHORT\"" out/dashboard.html; then
            echo "::error title=Build marker missing::out/dashboard.html に build-sha=$SHA_SHORT が無い — app/layout.tsx の meta と next.config.ts の BUILD_SHA を確認"
            grep -o 'name="build-sha"[^>]*' out/dashboard.html || echo '(meta 自体が無い)'
            exit 1
          fi
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf "https://naturism-admin.pages.dev/dashboard" | grep -q "$SHA_SHORT"; then
              echo "::notice title=Verified::production serves build $SHA_SHORT"; exit 0
            fi
            sleep 10
          done
          echo "::error title=Stale production::deploy は成功したが naturism-admin.pages.dev が build $SHA_SHORT を配っていない — Pages プロジェクトの production branch が 'main' か確認 (不一致だと preview に置かれる)"
          exit 1
        working-directory: apps/web

      - name: Notify deploy result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "::notice title=Admin web deployed::naturism-admin.pages.dev updated"
          else
            echo "::error title=Deploy failed::Admin web deployment failed — 上の失敗 step を確認 (wrangler step なら CLOUDFLARE_API_TOKEN の Pages:Edit 権限、verify step なら production branch 設定)"
          fi
