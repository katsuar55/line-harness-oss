name: Admin Ops

# 手動専用 (workflow_dispatch のみ) の運用オペレーション。
# ローカルに wrangler 認証が無い環境でも、CI の CLOUDFLARE_API_TOKEN で安全に実行するための経路。
#
#   enable-account-link:
#     ③アカウント連携の有効化 secret 3 種を wrangler secret bulk で投入する。
#     ACCOUNT_LINK_HMAC_KEY は runner 内で生成し、ログ/サマリには一切出力しない
#     (wrangler secret bulk / list は secret 名のみ出力する)。
#   fix-friends-metadata:
#     本番 D1 friends に metadata 列を追加 (schema drift 修復・冪等・追加のみで破壊なし)。
#     2026-07-02 発覚: 本番 friends に metadata 列が無く schema.sql:20 と乖離、
#     friends.metadata に書く機能 (preferred_hour 等) が silent fail していた。
#   expire-shopify-token:
#     shopify_tokens のキャッシュを失効させ、次回 API 呼び出しで新スコープの token を
#     再取得させる (read_all_orders スコープ追加後に 1 回実行する用途)。
#   secret-list:
#     read-only。wrangler secret list (名前のみ) をサマリに出す。gate 投入状態の確認用。
#   enable-rank-discount:
#     RANK_DISCOUNT_ENABLED=true を投入 (= 5c ランク割引コード発行の本番有効化)。
#     連携済 member への発行経路: my-rank LIFF 閲覧時の lazy 発行 + 月初 cron。
#   rank-discount-status:
#     read-only。loyalty_rank_discounts の status 別件数のみ (PII なし) をサマリに出す。
#     発行の定点観測用 (repo は public のため件数以外は出さない)。
#   put-teiki-flow-secret:
#     WI-2。TEIKI_FLOW_SECRET を GitHub Repository Secret から wrangler secret へ投入。
#   switch-link-metafield / rollback-link-metafield:
#     WI-6 (CRM PLUS 撤去)。friend↔customer 連携 metafield の ns/key secret を
#     lineharness/line_user_id へ切替 / 移行前の実効状態へ復元。
#     ⚠️ 実行順序は docs/CRMPLUS_UNINSTALL_RUNBOOK.md 厳守 (migration+verify green が前提)。
#   put-worker-api-key:
#     API_KEY (管理 API Bearer) を GitHub Repository Secret WORKER_API_KEY から再投入。
#     cutover-apikey.txt が 401 になった時の復旧用。
#   billing-kill / billing-status / apply-migration-071 / release-billing-hold:
#     WI-4 (Phase 3 自社課金基盤)。緊急停止 / 状態確認 (件数のみ) / migration 適用 /
#     §6.5 ops hold 解除 (claim と契約を単一 op で戻す)。
#   custom-domain-status / attach-custom-domain:
#     独自ドメイン crm.naturism-diet.com の接続。status は read-only の事前確認
#     (zone が同一アカウントにあるか)、attach は追加のみ・冪等。
#     ⚠️ 実行順序と後続手順は docs/CUSTOM_DOMAIN_RUNBOOK.md 厳守。
#   billing-kill:
#     WI-4 (Phase 3 課金基盤) の緊急停止。SELF_BILLING_ENABLED + SUB_MIGRATION_ENABLED を
#     同時 'false' 投入 (docs/PHASE3_BILLING_DESIGN_2026-07-19.md §8。Katsu 単独実行可)。
#     解除は同 §8 の解除 runbook (stuck claim 0 / overdue レビュー / バックログ分散 /
#     突合 green / 原因 PR merge 済み) を満たしてから手動で secret を戻す。
#   billing-status:
#     read-only。own_sub_contracts / billing_cycle_claims の status 別件数・breaker 状態・
#     quarantine 件数・own-billing heartbeat 直近1行 (いずれも件数/状態のみ、PII なし)。
#     ⚠️ migration 071 適用前はテーブル不在でクエリが fail する (適用後に使用)。
#   apply-migration-071:
#     migration 071 (Phase 3 課金基盤テーブル群) を wrangler d1 execute --file で直接適用。
#     CREATE TABLE IF NOT EXISTS のみで冪等・additive (既存テーブル無改変・データ破壊なし)。
#     d1_migrations state drift があるため migrations apply は使わない (メモリ: 全再実行 trap)。
#   apply-migration-072:
#     migration 072 (WI-4 step3 通知キュー own_billing_notice_queue) を同方式で適用。
#     CREATE TABLE IF NOT EXISTS + CREATE INDEX のみ = 冪等・additive。
#     未適用でも本番は無害 (gate OFF・enqueue 失敗は握って alert のみ) だが、
#     SELF_BILLING_ENABLED を ON にする前に必ず適用しておくこと。
#   apply-migration-074:
#     migration 074 (Flow 実測アンカー flow_estimate_anchor / skip_count_at_estimate)。
#     ADD COLUMN ×2 + 既存行の基準値初期化。列の有無を見てから流すので再実行可。
#     **実測値を受け始める前 (Flow 設定前) に適用しておくこと** — 未適用のまま実測が入ると
#     アンカー無しの flow 行ができ、その後のスキップが推定へ反映されない。
#   apply-migration-075:
#     migration 075 (実測の受信時刻 flow_measured_at)。ADD COLUMN ×1 のみ = additive。
#     **既存行は NULL のまま = 送信対象外**が意図 (鮮度不明を「新しい」とみなさない)。
#     🚨 **C2 のコードを deploy する前に適用すること** — upsertSubscriptionContract の
#     INSERT 列リストに本列が入るため、未適用のまま新コードが動くと契約 read-model への
#     **全書込** (webhook 導出・teiki-flow 受信・rebuild) が no such column で失敗する。
#   contract-diagnose:
#     read-only。契約 1 件の read-model を D1 から読み、Shopify 画面 (定期購買一覧 →
#     契約詳細の「次回ご注文日」) と照合する。実測検算 (列 == アンカーから導ける値) と
#     C2 のリマインド資格の内訳も出す。出力は契約 ID・日付・件数・真偽のみ (PII なし)。
#     入力 contract_id は素の数値でも gid://shopify/SubscriptionContract/<数値> でも可。
#   apply-migration-073:
#     migration 073 (サブスク連携獲得キット sub_link_tokens) を同方式で適用。
#     CREATE TABLE IF NOT EXISTS + CREATE INDEX のみ = 冪等・additive。
#   enable-sub-link:
#     SUB_LINK_ENABLED=true を投入 (= サブスク連携 magic-link の有効化)。
#     これ単体では何も送信しない (= 生成 API を叩き店舗が email を送って初めて機能する)。
#     前提: apply-migration-073 適用済み・LIFF_URL secret 設定済み。
#   enable-app-proxy-link:
#     APP_PROXY_LINK_ENABLED=true を投入 (= Shopify App Proxy 自動連携 /proxy/line-link の有効化)。
#     storefront_url を渡すと SHOPIFY_STOREFRONT_URL も併せて投入され、LIFF マイアカウントに
#     連携ボタンが出る。省略時は gate のみ ON (= proxy 経路の live 検証用・ボタン非表示の段階投入)。
#     前提: apply-migration-073 適用済み・Shopify Dev Dashboard で App Proxy 設定済み。
#   app-proxy-probe:
#     🚨 App Proxy 有効化**前**の必須否定テスト。storefront の /apps/line-link に
#     `?logged_in_customer_id=<架空の数値>` を付けて未ログインで叩き、Shopify が worker へ
#     転送した query の **logged_in_customer_id の出現回数**を worker ログから読む。
#       2 回 (= Shopify が自分の値を追記) → 重複キー拒否が効く = 安全
#       1 回で値が空 (= Shopify が上書き)          → 注入が無効化される = 安全
#       1 回で注入値のまま (= 訪問者の値を温存)     → 🚨 危険。有効化しないこと
#     出力は出現回数と「注入値が残ったか」の真偽のみ (署名・実顧客 id は出力しない)。
#   backfill-customer-friend-id:
#     連携済み friends (shopify_customer_id 保持) から shopify_customers.friend_id への
#     逆方向リンクを一括補完する (redeem 側は 2026-07-29 以降自動書込。これは既存分の後追い)。
#   delivery-status-diagnose:
#     read-only。LIFF 配送状況カードのデータ経路を件数のみで診断する:
#     直近14日の webhook 到達 (topic×status 件数) / 注文の friend 紐付け率 /
#     financial_status 内訳 / fulfillments の friend 紐付け率。PII なし。
#     「注文したのにミニアプリに出ない」時の一次切り分け用 (webhook 未達 vs 紐付け失敗)。
#   apply-migration-078:
#     migration 078 (連携特典クーポン台帳 line_link_coupons)。CREATE TABLE + INDEX のみ = additive・冪等。
#     gate LINK_REWARD_ENABLED が既定 off なので、適用しただけでは本番挙動は変わらない。
#   apply-migration-079:
#     migration 079 (紹介クーポン順次活性化 queue = line_referral_coupon_queue)。
#     CREATE TABLE + INDEX のみ = additive・冪等。未適用でも worker は従来の直接発行に
#     退行する設計 (安全) だが、「1 注文 1 枚」保証は適用後から効く。deploy 後すみやかに適用する。
#   enable-coupon-sweep:
#     COUPON_SWEEP_ENABLED=true。日次 JST 03:40 の期限 sweep + queue T2 活性化を開放。
#     前提: migration 079 適用済み (機械チェックする)。
#   apply-migration-080:
#     migration 080 (loyalty_rank_discounts.shopify_deactivated_at = supersede 済みランクコードの
#     Shopify 側無効化マーカー)。ALTER ADD COLUMN + INDEX = additive・live-safe。
#     ALTER は再適用で duplicate column エラーになるため、列存在を pragma で確認して skip する (冪等)。
#     未適用でも worker は列不在エラーを捕捉して sweep ④ を静かに skip する設計 (安全) だが、
#     supersede 済み旧コードの Shopify 側 kill はこの列が無いと前進しない。deploy 後すみやかに適用する。
#     ⚠️ 再試行 sweep ④ 自体は COUPON_SWEEP_ENABLED (別 gate・未投入) の内側 — 080 適用だけでは
#     再試行は走らない。issuer inline の deactivate 失敗分の回収は enable-coupon-sweep の投入が前提
#     (sweep ③ は待機紹介クーポンの活性化 + LINE push を含むため、投入タイミングは実機確認後 = 従来方針どおり)。
#   enable-link-reward / enable-subscription-menu / enable-subscription-reminder:
#     Sprint A の gate 開放 3 手 (2026-08-11 Katsu 承認済み)。**この順序で実行すること**。
#     各 op は前提を機械チェックしてから secret を投入する
#     (078 未適用のまま link-reward を ON にすると、Shopify にだけコードが残って顧客に届かない /
#      MENU 未確認のまま REMINDER を ON にすると「初めて見るカード」が push で届く)。
#     詳細と根拠: docs/SUBSCRIPTION_GATE_CRITERIA.md
#   faq-subscription-audit:
#     read-only。定期便系 FAQ (auto_replies=チャット自動応答 / faq_items=LIFF FAQ タブ) の
#     有効行を件数+既知文言の指紋で監査する (実態 = 定期便の操作はマイページのみ)。
#     あわせて AI 応答モデルの実測分布 (conversation_logs) を出す。本文・PII は出さない。
#   audit-stale-coupon-copy:
#     read-only。DB 管理の顧客向け文面 (auto_replies / automations / faq_items) に旧額
#     「500円」が残っていないか監査する (welcome は #255 で ¥300 化・連携は #249 で ¥300 化)。
#     ⚠️ 紹介クーポン (referrer ¥500 / 被紹介 格上げ ¥500) の「500円」は**正**なので、
#     ヒット = 即誤りではない。出力は source/id/is_active のみ (本文は公開ログに出さない)。
#     ヒットした行の本文確認と修正は管理画面から人間が行う。
#   cron-failure-diagnose:
#     read-only。ダッシュボード system.failingJobs に出た cron の一次切り分け。
#     ① 直近7日の job×status 件数 ② ai-models-catalog-sync の error_summary/metrics 実物
#     ③ Cloudflare AI models API を **workflow 側の token** で叩いた結果 (HTTP と件数のみ)。
#     ③ が 200 なら endpoint/account は健全 = 原因は worker 側 (token 権限 or 実装) に絞れる。
#     error_summary は本 job では実装が生成する内部文字列のみ (PII なし) なので出力してよい。
#     他 job は件数のみ (未知の文字列を公開ログに出さないため)。
#   enable-portal-bootstrap / disable-portal-bootstrap:
#     ポータル初期化の一括 read (Ultraplan PR-3, #258) の gate 開閉。enable は
#     ① PR-3 コードが本番に deploy 済みかを本番 HTML で機械チェック →
#     ② PORTAL_BOOTSTRAP_ENABLED=true 投入 → ③ gate-on HTML の伝播を実測 (5s×12) →
#     ④ liff-health (打ち切り/parse/watchdog) まで通す。disable は即時 kill switch
#     (redeploy 不要 — client は従来の個別 fetch 経路へ戻る)。
#
# ⚠️ repo は PUBLIC = workflow ログ/サマリは公開される。secret の値・顧客データ (PII) を
#    echo/サマリ出力する op を追加してはならない (名前・件数のみ可)。
#
# 必要な GitHub secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (deploy と同一)

on:
  workflow_dispatch:
    inputs:
      op:
        description: 'Operation'
        required: true
        type: choice
        options:
          - enable-account-link
          - fix-friends-metadata
          - expire-shopify-token
          - secret-list
          - enable-rank-discount
          - rank-discount-status
          - put-teiki-flow-secret
          - switch-link-metafield
          - rollback-link-metafield
          - put-worker-api-key
          - billing-kill
          - billing-status
          - apply-migration-071
          - apply-migration-072
          - apply-migration-073
          - enable-sub-link
          - enable-app-proxy-link
          - app-proxy-probe
          - disable-app-proxy-link
          - app-proxy-status
          - backfill-customer-friend-id
          - delivery-status-diagnose
          - shopify-scope-probe
          - release-billing-hold
          - custom-domain-status
          - reminder-dry-run
          - apply-migration-069-070
          - apply-migration-074
          - apply-migration-075
          - contract-diagnose
          - rebuild-subscription-contracts
          - enable-subscription-ingest
          - disable-subscription-ingest
          - attach-custom-domain
          - apply-faq-v4
          - faq-subscription-audit
          - apply-migration-078
          - apply-migration-079
          - apply-migration-080
          - enable-coupon-sweep
          - enable-link-reward
          - enable-subscription-menu
          - enable-subscription-reminder
          - cron-failure-diagnose
          - audit-stale-coupon-copy
          - enable-portal-bootstrap
          - disable-portal-bootstrap
      contract_gid:
        description: 'release-billing-hold 用: 対象契約 gid (例 gid://shopify/SubscriptionContract/123)'
        required: false
        type: string
      contract_id:
        description: 'contract-diagnose 用: 契約 ID (素の数値 か gid://... のどちらでも可。例 181614444797)'
        required: false
        type: string
      storefront_url:
        description: 'enable-app-proxy-link 用: storefront 公開 URL (例 https://naturism-diet.com)。省略時は gate のみ ON'
        required: false
        type: string
      force:
        description: 'rebuild-subscription-contracts 用: 収集 gate ON 中でも実行する (未消化スキップの先送りを消す可能性あり)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  admin-op:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable account link (secrets bulk)
        if: inputs.op == 'enable-account-link'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # HMAC pepper は runner 内で生成。echo しない・ファイルは即削除。
          HMAC=$(openssl rand -hex 32)
          TMP="$RUNNER_TEMP/secrets.account-link.json"
          printf '{"ACCOUNT_LINK_ENABLED":"true","ACCOUNT_LINK_HMAC_KEY":"%s","MEMBER_BACKFILL_ENABLED":"true"}' "$HMAC" > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"

      - name: Put TEIKI_FLOW_SECRET (WI-2, from repository secret)
        if: inputs.op == 'put-teiki-flow-secret'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 値は GitHub Repository Secret (Settings → Secrets and variables → Actions) に
          # TEIKI_FLOW_SECRET として保存しておく。PUBLIC repo のログには一切出力しない。
          TEIKI_FLOW_SECRET_VALUE: ${{ secrets.TEIKI_FLOW_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${TEIKI_FLOW_SECRET_VALUE:-}" ]; then
            echo "Repository secret TEIKI_FLOW_SECRET が未設定です (Settings → Secrets and variables → Actions で作成してから再実行)" >&2
            exit 1
          fi
          # TMP は温度感の高い予約名 (temp dir 環境変数) なので専用名を使う (採点R3)
          export SECRETS_JSON_PATH="$RUNNER_TEMP/secrets.teiki-flow.json"
          # wrangler 失敗時 (set -e で即終了) でも平文 JSON を残さない (採点R4)
          trap 'rm -f "$SECRETS_JSON_PATH"' EXIT
          node -e 'require("fs").writeFileSync(process.env.SECRETS_JSON_PATH, JSON.stringify({ TEIKI_FLOW_SECRET: process.env.TEIKI_FLOW_SECRET_VALUE }))'
          npx wrangler secret bulk "$SECRETS_JSON_PATH"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"

      - name: Switch link metafield to lineharness.line_user_id (WI-6)
        if: inputs.op == 'switch-link-metafield'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 値は非機密 (metafield の ns/key 名) だが、secret が hardcoded default を上書きする
          # 構成のため secret として投入する (feedback_secret_overrides_hardcoded_default)。
          # 前提: migration endpoint + verify で lineharness.line_user_id のパリティ確認済み
          # (docs/CRMPLUS_UNINSTALL_RUNBOOK.md)。
          echo '⚠️ 前提確認: runbook 手順2-3 (migration remaining=0 + verify resolved==candidatesTotal) を' >> "$GITHUB_STEP_SUMMARY"
          echo '   完了してから実行すること。未完なら rollback-link-metafield で即復旧できる。' >> "$GITHUB_STEP_SUMMARY"
          SECRETS_JSON_PATH="$RUNNER_TEMP/secrets.link-metafield.json"
          trap 'rm -f "$SECRETS_JSON_PATH"' EXIT
          printf '{"FRIEND_LINK_METAFIELD_NAMESPACE":"lineharness","FRIEND_LINK_METAFIELD_KEY":"line_user_id","ACCOUNT_LINK_METAFIELD_NAMESPACE":"lineharness","ACCOUNT_LINK_METAFIELD_KEY":"line_user_id"}' > "$SECRETS_JSON_PATH"
          npx wrangler secret bulk "$SECRETS_JSON_PATH"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback link metafield to socialplus.line (WI-6 rollback)
        if: inputs.op == 'rollback-link-metafield'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # ロールバック = 移行前の実効状態を復元:
          #   - FRIEND_LINK (reverse 読取) = socialplus/line (CRM PLUS の metafield。
          #     アンインストール前なら残存しているため即復旧可、アンインストール後は不可)
          #   - ACCOUNT_LINK (forward 書込) = naturism/line_user_id (移行前は secret 未設定で
          #     コードデフォルト naturism が実効値だった。2026-07-19 secret-list で確認)
          SECRETS_JSON_PATH="$RUNNER_TEMP/secrets.link-metafield-rollback.json"
          trap 'rm -f "$SECRETS_JSON_PATH"' EXIT
          printf '{"FRIEND_LINK_METAFIELD_NAMESPACE":"socialplus","FRIEND_LINK_METAFIELD_KEY":"line","ACCOUNT_LINK_METAFIELD_NAMESPACE":"naturism","ACCOUNT_LINK_METAFIELD_KEY":"line_user_id"}' > "$SECRETS_JSON_PATH"
          npx wrangler secret bulk "$SECRETS_JSON_PATH"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"

      - name: Put API_KEY from repository secret (WORKER_API_KEY)
        if: inputs.op == 'put-worker-api-key'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 値は GitHub Repository Secret WORKER_API_KEY に保存しておく (PUBLIC repo のログには
          # 一切出力しない)。ローカルの apps/worker/cutover-apikey.txt にも同値を保存すること。
          WORKER_API_KEY_VALUE: ${{ secrets.WORKER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_API_KEY_VALUE:-}" ]; then
            echo "Repository secret WORKER_API_KEY が未設定です (Settings → Secrets and variables → Actions で作成してから再実行)" >&2
            exit 1
          fi
          export SECRETS_JSON_PATH="$RUNNER_TEMP/secrets.worker-api-key.json"
          trap 'rm -f "$SECRETS_JSON_PATH"' EXIT
          node -e 'require("fs").writeFileSync(process.env.SECRETS_JSON_PATH, JSON.stringify({ API_KEY: process.env.WORKER_API_KEY_VALUE }))'
          npx wrangler secret bulk "$SECRETS_JSON_PATH"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"

      - name: Fix friends.metadata column (idempotent)
        if: inputs.op == 'fix-friends-metadata'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          HAS=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('friends') WHERE name='metadata'")
          echo "$HAS"
          if echo "$HAS" | grep -Eq '"n": *1'; then
            echo "metadata column already exists — skip"
          else
            npx wrangler d1 execute naturism-line-crm --remote \
              --command "ALTER TABLE friends ADD COLUMN metadata TEXT NOT NULL DEFAULT '{}'"
          fi
          echo '### Verification (pragma_table_info)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name, type, dflt_value FROM pragma_table_info('friends') WHERE name='metadata'" >> "$GITHUB_STEP_SUMMARY"

      - name: Expire shopify token cache
        if: inputs.op == 'expire-shopify-token'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute naturism-line-crm --remote \
            --command "UPDATE shopify_tokens SET expires_at='2020-01-01T00:00:00.000Z' WHERE id='default'"
          echo 'shopify token cache expired — next API call will re-fetch with current scopes' >> "$GITHUB_STEP_SUMMARY"

      - name: List secrets (names only, read-only)
        if: inputs.op == 'secret-list'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enable rank discount (RANK_DISCOUNT_ENABLED)
        if: inputs.op == 'enable-rank-discount'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/secrets.rank-discount.json"
          printf '{"RANK_DISCOUNT_ENABLED":"true"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Billing kill (WI-4 emergency stop)
        if: inputs.op == 'billing-kill'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # §8: 発行 + 期限 sweep + 移行 phase 自動遷移を同時停止。受信・同期・結果回収は継続。
          TMP="$RUNNER_TEMP/secrets.billing-kill.json"
          trap 'rm -f "$TMP"' EXIT
          printf '{"SELF_BILLING_ENABLED":"false","SUB_MIGRATION_ENABLED":"false"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          echo '### billing-kill applied (SELF_BILLING_ENABLED=false, SUB_MIGRATION_ENABLED=false)' >> "$GITHUB_STEP_SUMMARY"
          echo '確認: 5-10分後 (実行中 tick は旧 env のまま完走するため) に billing-status を実行し、own-billing heartbeat が skippedGating=true になっていること' >> "$GITHUB_STEP_SUMMARY"
          echo '解除は設計書 §8 の解除 runbook を満たしてから (stuck claim 0 / overdue レビュー / バックログ分散 / 突合 green / 原因 PR merge 済み)' >> "$GITHUB_STEP_SUMMARY"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"

      - name: Billing status (counts only, read-only)
        if: inputs.op == 'billing-status'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # migration 071 未適用なら fail せず案内を出して終了 (review LOW: 実行順ミスの ergonomics)
          HAS=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='own_sub_contracts'")
          if ! echo "$HAS" | grep -Eq '"n": *1'; then
            echo 'migration 071 not applied yet — run apply-migration-071 first' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo '### own_sub_contracts (counts by status, no PII)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT status, COUNT(*) AS n FROM own_sub_contracts GROUP BY status" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### billing_cycle_claims (counts by status)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT status, COUNT(*) AS n FROM billing_cycle_claims GROUP BY status" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### breaker / quarantine' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT key, updated_at FROM own_billing_state" | tee -a "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS quarantined FROM own_billing_quarantine" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### own-billing heartbeat (latest 1)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT ran_at, status, metrics_json FROM cron_run_logs WHERE job_name='own-billing' ORDER BY ran_at DESC LIMIT 1" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Custom domain status (read-only — zone とアタッチ状況の確認)
        if: inputs.op == 'custom-domain-status'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_HOSTNAME: crm.naturism-diet.com
          TARGET_ZONE: naturism-diet.com
          WORKER_NAME: naturism-line-crm
        run: |
          set -euo pipefail
          # 独自ドメイン接続の事前確認 (docs/CUSTOM_DOMAIN_RUNBOOK.md 手順1)。
          # attach 前に「zone が同一 Cloudflare アカウントにあるか」を必ずここで確認する
          # (無い状態で attach すると失敗するため)。出力は zone 名/有無のみ (トークンは出さない)。
          ZONES=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/zones?name=$TARGET_ZONE" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          DOMAINS=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          ZONES="$ZONES" DOMAINS="$DOMAINS" TARGET_HOSTNAME="$TARGET_HOSTNAME" \
            WORKER_NAME="$WORKER_NAME" node -e '
              const z = JSON.parse(process.env.ZONES || "{}");
              const d = JSON.parse(process.env.DOMAINS || "{}");
              const zone = (z.result || [])[0];
              const attached = (d.result || []).find((x) => x.hostname === process.env.TARGET_HOSTNAME);
              const lines = [];
              lines.push("### Custom domain status");
              lines.push("- zone_api_ok: " + (z.success === true));
              lines.push("- zone_found_in_this_account: " + (zone ? "YES" : "NO"));
              if (zone) lines.push("- zone_status: " + zone.status);
              lines.push("- domains_api_ok: " + (d.success === true));
              lines.push("- already_attached: " + (attached ? "YES (service=" + attached.service + ")" : "NO"));
              lines.push("");
              const wrongService = attached && attached.service !== process.env.WORKER_NAME;
              lines.push(!zone
                ? "→ zone が見つかりません。naturism-diet.com が別の Cloudflare アカウントにあるか、API トークンに Zone 読取権限がありません。attach は実行しないでください。"
                : wrongService
                  ? "→ このホスト名は別の worker (service=" + attached.service + ") にアタッチ済みです。先にそちらの解除が必要です。attach は失敗します。"
                  : attached
                    ? "→ 既に本 worker にアタッチ済みです。追加の作業は不要です (attach を実行しても no-op)。"
                    : "→ zone は同一アカウントにあります。attach-custom-domain を実行できます。");
              console.log(lines.join("\n"));
            ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attach custom domain (crm.naturism-diet.com → worker)
        if: inputs.op == 'attach-custom-domain'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_HOSTNAME: crm.naturism-diet.com
          TARGET_ZONE: naturism-diet.com
          WORKER_NAME: naturism-line-crm
        run: |
          set -euo pipefail
          # 追加のみ (workers.dev の既存 URL は併存して生き続ける)。冪等: 既にアタッチ済みなら成功扱い。
          # 前提: custom-domain-status で zone_found_in_this_account=YES を確認済みであること。
          ZONES=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/zones?name=$TARGET_ZONE" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          ZONE_ID=$(ZONES="$ZONES" node -e 'const z=JSON.parse(process.env.ZONES||"{}");const r=(z.result||[])[0];process.stdout.write(r?r.id:"")')
          if [ -z "$ZONE_ID" ]; then
            echo "zone $TARGET_ZONE が見つかりません。custom-domain-status を先に実行して確認してください。" >&2
            exit 1
          fi
          # 冪等性: 既に本 worker にアタッチ済みなら no-op で正常終了、別 worker なら明示エラー
          EXIST=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          PRECHECK=$(EXIST="$EXIST" TARGET_HOSTNAME="$TARGET_HOSTNAME" WORKER_NAME="$WORKER_NAME" node -e '
            const d = JSON.parse(process.env.EXIST || "{}");
            const a = (d.result || []).find((x) => x.hostname === process.env.TARGET_HOSTNAME);
            if (!a) { process.stdout.write("PROCEED"); }
            else if (a.service === process.env.WORKER_NAME) { process.stdout.write("ALREADY"); }
            else { process.stdout.write("CONFLICT:" + a.service); }
          ')
          case "$PRECHECK" in
            ALREADY)
              echo "### attach-custom-domain: 既にアタッチ済み (no-op)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            CONFLICT:*)
              echo "$TARGET_HOSTNAME は別の worker (${PRECHECK#CONFLICT:}) にアタッチ済みです。先に解除してください。" >&2
              exit 1 ;;
          esac
          RESP=$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"environment\":\"production\",\"hostname\":\"$TARGET_HOSTNAME\",\"service\":\"$WORKER_NAME\",\"zone_id\":\"$ZONE_ID\"}")
          RESP="$RESP" TARGET_HOSTNAME="$TARGET_HOSTNAME" node -e '
            const r = JSON.parse(process.env.RESP || "{}");
            const ok = r.success === true;
            console.log("### attach-custom-domain: " + (ok ? "OK" : "FAILED"));
            console.log("- hostname: " + process.env.TARGET_HOSTNAME);
            if (!ok) console.log("- errors: " + JSON.stringify(r.errors || []));
            else console.log("→ 数分で https://" + process.env.TARGET_HOSTNAME + " が有効になります (SSL 証明書の発行待ち)。workers.dev の URL も引き続き使えます。");
            if (!ok) process.exit(1);
          ' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '⚠️ 次の手順: docs/CUSTOM_DOMAIN_RUNBOOK.md の「手順3以降」(LINE/Shopify のコールバック URL 追加・secret 切替) を実施するまで、LIFF や OAuth は旧 URL のままにしておくこと。' >> "$GITHUB_STEP_SUMMARY"

      - name: Release billing hold (WI-4 §6.5 ops 解除 op — claim と契約を単一 op で戻す)
        if: inputs.op == 'release-billing-hold'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTRACT_GID: ${{ inputs.contract_gid }}
        run: |
          set -euo pipefail
          if [ -z "${CONTRACT_GID:-}" ]; then
            echo "contract_gid 入力が必要です (例 gid://shopify/SubscriptionContract/123)" >&2
            exit 1
          fi
          # gid 形式の検証 (SQL に渡す前の防御)。
          # 🚨 grep を使わないこと — grep は**行単位**で評価するため、改行を含む入力は
          # 1 行目さえ通れば素通りする (`123\n'; UPDATE ...` が検証を抜ける)。
          # workflow_dispatch の string 入力は REST/gh 経由なら複数行を渡せるうえ、
          # wrangler の --command は `;` 区切りの複数文を実行する (下の 2 文がその実例)。
          # case は**文字列全体**をパターンマッチするので改行も非許可文字として弾ける。
          GID_PREFIX='gid://shopify/SubscriptionContract/'
          case "$CONTRACT_GID" in
            "$GID_PREFIX"*) GID_NUM="${CONTRACT_GID#"$GID_PREFIX"}" ;;
            *) GID_NUM='' ;;
          esac
          case "$GID_NUM" in
            ''|*[!0-9]*)
              echo "contract_gid の形式が不正です: gid://shopify/SubscriptionContract/<数値> のみ受け付けます" >&2
              exit 1
              ;;
          esac
          # §6.5: 解除は retry_policy→none と dunning_state→none (+dunning 系列のリセット =
          # I-6 解放句と対称) を単一コマンドで実施 (戻し忘れ・部分適用の構造排除)。
          # 再評価は次 tick の due 発行に委譲。本 op は冪等 — 失敗時はそのまま再実行してよい。
          npx wrangler d1 execute naturism-line-crm --remote \
            --command "UPDATE billing_cycle_claims SET retry_policy='none' WHERE contract_gid='$CONTRACT_GID' AND retry_policy='hold'; UPDATE own_sub_contracts SET dunning_state='none', dunning_attempts=0, next_retry_date=NULL, dunning_deadline_at=NULL WHERE contract_gid='$CONTRACT_GID' AND dunning_state='ops_hold'"
          echo '### release-billing-hold applied (counts only)' >> "$GITHUB_STEP_SUMMARY"
          echo '⚠️ 注意: 当該サイクルの予定日から 14 日を超えている場合、解除しても次の発行時に I-6 が' >> "$GITHUB_STEP_SUMMARY"
          echo '   サイクルを放棄します (skip + 次アンカーへ。当該回は課金されません)。billing-status で予定日を確認のこと。' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM billing_cycle_claims WHERE contract_gid='$CONTRACT_GID' AND retry_policy='hold') AS holds_left, (SELECT COUNT(*) FROM own_sub_contracts WHERE contract_gid='$CONTRACT_GID' AND dunning_state='ops_hold') AS ops_hold_left" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply migration 071 (own-billing foundation, idempotent)
        if: inputs.op == 'apply-migration-071'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute naturism-line-crm --remote \
            --file ../../packages/db/migrations/071_own_billing_foundation.sql
          echo '### Verification (new tables)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('own_sub_contracts','billing_cycle_claims','sub_migration_snapshots','own_billing_notices','own_billing_state','own_billing_quarantine') ORDER BY name" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply migration 072 (own-billing notice queue, idempotent)
        if: inputs.op == 'apply-migration-072'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute naturism-line-crm --remote \
            --file ../../packages/db/migrations/072_own_billing_notice_queue.sql
          echo '### Verification (notice queue table + row count)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='own_billing_notice_queue'" | tee -a "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS queued_rows FROM own_billing_notice_queue" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply migration 073 (sub-link tokens, idempotent)
        if: inputs.op == 'apply-migration-073'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute naturism-line-crm --remote \
            --file ../../packages/db/migrations/073_sub_link_tokens.sql
          echo '### Verification (sub_link_tokens table)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='sub_link_tokens'" | tee -a "$GITHUB_STEP_SUMMARY"

      # 連携特典クーポン台帳 (migration 078)。CREATE TABLE + INDEX のみ = additive・冪等。
      # gate LINK_REWARD_ENABLED が既定 off なので、適用しただけでは本番挙動は変わらない。
      - name: Apply migration 078 (link reward coupons, additive)
        if: inputs.op == 'apply-migration-078'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute naturism-line-crm --remote \
            --file ../../packages/db/migrations/078_line_link_coupons.sql
          echo '### Verification (line_link_coupons table + 冪等キー 2 本)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='line_link_coupons'" | tee -a "$GITHUB_STEP_SUMMARY"
          # 1 人生涯 1 枚は UNIQUE(friend_id) と UNIQUE INDEX(shopify_customer_id) の 2 本で担保する。
          # 片方だけだと機種変更サイクルで 2 枚目が出るので、両方あることを必ず確認する。
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name, \"unique\" FROM pragma_index_list('line_link_coupons')" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### Verification (既定額が 300 であること)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name, dflt_value FROM pragma_table_info('line_link_coupons') WHERE name='discount_value'" | tee -a "$GITHUB_STEP_SUMMARY"

      # 紹介クーポン順次活性化 queue (migration 079)。additive・冪等。
      - name: Apply migration 079 (line_referral_coupon_queue)
        if: inputs.op == 'apply-migration-079'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute naturism-line-crm --remote \
            --file ../../packages/db/migrations/079_line_referral_coupon_queue.sql
          echo '### Verification (line_referral_coupon_queue table + reward_id UNIQUE)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='line_referral_coupon_queue'" | tee -a "$GITHUB_STEP_SUMMARY"
          # 冪等キー reward_id の UNIQUE が立っていること (二重 enqueue 防止の根幹)
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name, \"unique\" FROM pragma_index_list('line_referral_coupon_queue')" | tee -a "$GITHUB_STEP_SUMMARY"

      # ランクコードの Shopify 側無効化マーカー (migration 080)。ALTER = 列存在チェックで冪等化。
      - name: Apply migration 080 (loyalty_rank_discounts.shopify_deactivated_at)
        if: inputs.op == 'apply-migration-080'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # ALTER ADD COLUMN は再適用で duplicate column になるため、列が既に在れば skip (冪等)
          COL=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM pragma_table_info('loyalty_rank_discounts') WHERE name='shopify_deactivated_at'")
          if echo "$COL" | grep -q 'shopify_deactivated_at'; then
            echo 'ℹ️ shopify_deactivated_at は既に存在 — ALTER を skip (INDEX は IF NOT EXISTS で冪等)' | tee -a "$GITHUB_STEP_SUMMARY"
            npx wrangler d1 execute naturism-line-crm --remote \
              --command "CREATE INDEX IF NOT EXISTS idx_loyalty_rank_discounts_pending_deactivation ON loyalty_rank_discounts(status, shopify_deactivated_at) WHERE shopify_deactivated_at IS NULL"
          else
            npx wrangler d1 execute naturism-line-crm --remote \
              --file ../../packages/db/migrations/080_loyalty_rank_shopify_deactivated.sql
          fi
          echo '### Verification (列 + index)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM pragma_table_info('loyalty_rank_discounts') WHERE name='shopify_deactivated_at'" | tee -a "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM pragma_index_list('loyalty_rank_discounts') WHERE name='idx_loyalty_rank_discounts_pending_deactivation'" | tee -a "$GITHUB_STEP_SUMMARY"

      # DB 管理文面の旧額「500円」残存監査 (read-only・PUBLIC ログには source/id/件数のみ)。
      - name: Audit stale coupon copy (500円 in DB-managed texts)
        if: inputs.op == 'audit-stale-coupon-copy'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '### 「500円」を含む DB 管理文面 (source / id / is_active のみ)' >> "$GITHUB_STEP_SUMMARY"
          echo '紹介クーポン (referrer ¥500 / 被紹介 ¥500) の言及は正。welcome/連携の ¥500 は旧額 = 要修正。' >> "$GITHUB_STEP_SUMMARY"
          # 2 段構え: ①broad = 「500円」を含む全行 (偽陰性ゼロ・人間が本文を管理画面で確認)
          #           ②narrowed = 「,500円」(送料 5,500円/1,500円 等の桁区切り部分一致) を除いた行。
          # ⚠️ narrowed の除外は**行単位**なので、送料表記とクーポン旧額が同一文面に共存する行は
          # narrowed から消える — 判定は必ず broad を正とし、narrowed は当たりを付ける補助に使う。
          echo '#### ① broad (全ヒット — これが正)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "\
            SELECT 'auto_replies' AS src, id, is_active FROM auto_replies WHERE response_content LIKE '%500円%' \
            UNION ALL SELECT 'automations', id, is_active FROM automations WHERE actions LIKE '%500円%' \
            UNION ALL SELECT 'faq_items', id, is_active FROM faq_items WHERE answer LIKE '%500円%'" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '#### ② narrowed (桁区切り価格の偽陽性を除いた当たり付け — 共存行は消えるので broad と突合)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "\
            SELECT 'auto_replies' AS src, id, is_active FROM auto_replies WHERE response_content LIKE '%500円%' AND response_content NOT LIKE '%,500円%' \
            UNION ALL SELECT 'automations', id, is_active FROM automations WHERE actions LIKE '%500円%' AND actions NOT LIKE '%,500円%' \
            UNION ALL SELECT 'faq_items', id, is_active FROM faq_items WHERE answer LIKE '%500円%' AND answer NOT LIKE '%,500円%'" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### 参考: 「300円」を含む行数 (新額の浸透度)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "\
            SELECT 'auto_replies' AS src, COUNT(*) AS n FROM auto_replies WHERE response_content LIKE '%300円%' \
            UNION ALL SELECT 'automations', COUNT(*) FROM automations WHERE actions LIKE '%300円%' \
            UNION ALL SELECT 'faq_items', COUNT(*) FROM faq_items WHERE answer LIKE '%300円%'" | tee -a "$GITHUB_STEP_SUMMARY"

      # クーポン期限 sweep + queue T2 活性化の開放 (日次 JST 03:40)。
      - name: Enable coupon sweep (COUPON_SWEEP_ENABLED=true)
        if: inputs.op == 'enable-coupon-sweep'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 前提: migration 079 適用済み。未適用のまま ON にしても sweep は
          # pre-migration ガードで queue 系を skip する (安全) が、意図した T2 が動かないので拒む。
          TABLE=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='line_referral_coupon_queue'")
          if ! echo "$TABLE" | grep -q 'line_referral_coupon_queue'; then
            echo '❌ line_referral_coupon_queue が存在しません — apply-migration-079 を先に実行してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          TMP="$RUNNER_TEMP/secrets.coupon-sweep.json"
          printf '{"COUPON_SWEEP_ENABLED":"true"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          echo '✅ COUPON_SWEEP_ENABLED=true (次の JST 03:40 tick から sweep 稼働)' >> "$GITHUB_STEP_SUMMARY"

      # 連携特典クーポン (¥300/7日) の発行を有効化。Sprint A-1。
      - name: Enable link reward coupon (LINK_REWARD_ENABLED=true)
        if: inputs.op == 'enable-link-reward'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 前提: migration 078 適用済み。未適用のまま ON にすると、連携した顧客に対して
          # Shopify のクーポンは発行されるのに台帳 INSERT が table 不在で失敗し、
          # **顧客には出せないコードが Shopify 側にだけ残る** (回収不能なゴミ + 特典が届かない)。
          TABLE=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='line_link_coupons'")
          if ! echo "$TABLE" | grep -q 'line_link_coupons'; then
            echo '❌ line_link_coupons が存在しません — apply-migration-078 を先に実行してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          TMP="$RUNNER_TEMP/secrets.link-reward.json"
          printf '{"LINK_REWARD_ENABLED":"true"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"
          echo '⚠️ これ以降、顧客が自分で連携を完了すると ¥300 クーポンが実発行されます。実機で 1 件確認してください。' >> "$GITHUB_STEP_SUMMARY"

      # 顧客可視面 (契約カード) の開放。2026-08-11 Katsu 承認済み。
      - name: Enable subscription MENU (SUBSCRIPTION_MENU_ENABLED=true)
        if: inputs.op == 'enable-subscription-menu'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 前提: 受理レイヤー (SUB_INTENT_ENABLED) が入っていること。入っていない状態で MENU を
          # 開けると、カードのボタンが「案内で終わる」旧トークンのままになる (§10 実装順序6)。
          if ! npx wrangler secret list | grep -q 'SUB_INTENT_ENABLED'; then
            echo '❌ SUB_INTENT_ENABLED が未投入です — 受理レイヤーを先に有効化してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          TMP="$RUNNER_TEMP/secrets.sub-menu.json"
          printf '{"SUBSCRIPTION_MENU_ENABLED":"true"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"
          echo '⚠️ これ以降、契約カードが顧客に見えます。実機で日付表示を確認してください (`contract-diagnose` で Shopify 画面と照合可)。' >> "$GITHUB_STEP_SUMMARY"

      # 決済リマインドの送信開放。**ここで初めて push が飛ぶ**。2026-08-11 Katsu 承認済み。
      - name: Enable subscription REMINDER (SUBSCRIPTION_REMINDER_ENABLED=true)
        if: inputs.op == 'enable-subscription-reminder'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 前提1: MENU が先 (docs/SUBSCRIPTION_GATE_CRITERIA.md の開放順序)。
          # リマインドのカードは MENU と同じビルダーなので、MENU を確認せずに送ると
          # 「初めて見るカード」が push で届く。
          if ! npx wrangler secret list | grep -q 'SUBSCRIPTION_MENU_ENABLED'; then
            echo '❌ SUBSCRIPTION_MENU_ENABLED が未投入です — MENU を先に開けて実機確認してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # 前提2: 条件3 (測定器の生存)。これが 0 だと開けても 1 通も飛ばない = 開ける意味がない。
          ALIVE=$(npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT COUNT(*) AS n FROM cron_run_logs
             WHERE job_name = 'teiki-flow-ingest' AND status = 'success'
               AND datetime(ran_at) >= datetime('now','+9 hours','-72 hours')")
          echo "$ALIVE" | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$ALIVE" | grep -Eq '"n": *0'; then
            echo '❌ 条件3 未達 (直近 72h に実測受信なし) — Shopify Flow の実行ログを確認してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### 開放時点の送信対象 (would_actually_send が 0 なら初回は誰にも飛ばない)' >> "$GITHUB_STEP_SUMMARY"
          echo '判定の詳細は `reminder-dry-run` を参照。' >> "$GITHUB_STEP_SUMMARY"
          TMP="$RUNNER_TEMP/secrets.sub-reminder.json"
          printf '{"SUBSCRIPTION_REMINDER_ENABLED":"true"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"
          echo '⚠️ これ以降、条件を満たした契約に決済リマインドが **実際に push されます**。' >> "$GITHUB_STEP_SUMMARY"

      - name: Enable sub-link (SUB_LINK_ENABLED=true)
        if: inputs.op == 'enable-sub-link'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 前提: migration 073 適用済み (未適用のまま ON にすると generate/redeem が table 不在で 500)。
          TABLE=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='sub_link_tokens'")
          if ! echo "$TABLE" | grep -q 'sub_link_tokens'; then
            echo '❌ sub_link_tokens が存在しません — apply-migration-073 を先に実行してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          TMP="$RUNNER_TEMP/secrets.sub-link.json"
          printf '{"SUB_LINK_ENABLED":"true"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"

      - name: Enable App Proxy link (APP_PROXY_LINK_ENABLED=true)
        if: inputs.op == 'enable-app-proxy-link'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STOREFRONT_URL: ${{ inputs.storefront_url }}
        run: |
          set -euo pipefail
          # 前提: migration 073 適用済み (redeem 側が sub_link_tokens を使うため)。
          TABLE=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='sub_link_tokens'")
          if ! echo "$TABLE" | grep -q 'sub_link_tokens'; then
            echo '❌ sub_link_tokens が存在しません — apply-migration-073 を先に実行してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # feature が実際に必要とする secret の存在を先に確認する。
          # misconfigured / unauthorized / disabled は全て 404 に collapse する設計なので、
          # 投入漏れがあると「有効化したのに全部 404」を外形から切り分けられない。
          SECRETS=$(npx wrangler secret list)
          for NAME in SHOPIFY_CLIENT_SECRET LIFF_URL SHOPIFY_STORE_DOMAIN; do
            if ! echo "$SECRETS" | grep -q "\"$NAME\""; then
              echo "❌ secret $NAME が未設定です — App Proxy は 404 のままになります" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          TMP="$RUNNER_TEMP/secrets.app-proxy-link.json"
          if [ -n "$STOREFRONT_URL" ]; then
            # worker 側 (liff-pages.ts) の判定 ^https://[A-Za-z0-9.-]+$ と揃える。
            # ここを緩くすると「gate は ON なのに LIFF のボタンだけ無音で出ない」乖離が起きる。
            # 🚨 grep を使わないこと — 行単位評価なので `https://ok.example\n<ゴミ>` が
            # 1 行目だけで通り、改行を含んだ値が secret に入る (worker 側の正規表現は
            # 文字列全体を見るので弾かれ、まさにこの「無音で出ない」乖離になる)。
            URL_TRIMMED="${STOREFRONT_URL%/}"
            case "$URL_TRIMMED" in
              https://*) URL_HOST="${URL_TRIMMED#https://}" ;;
              *) URL_HOST='' ;;
            esac
            case "$URL_HOST" in
              ''|*[!A-Za-z0-9.-]*)
                echo '❌ storefront_url は https://<ホスト名> 形式のみ (path / port / query / 改行は不可)' | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
            node -e 'const fs=require("fs");fs.writeFileSync(process.argv[1],JSON.stringify({APP_PROXY_LINK_ENABLED:"true",SHOPIFY_STOREFRONT_URL:process.env.STOREFRONT_URL.trim().replace(/\/+$/,"")}))' "$TMP"
          else
            printf '{"APP_PROXY_LINK_ENABLED":"true"}' > "$TMP"
          fi
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"

      - name: App Proxy status (counts only, read-only)
        if: inputs.op == 'app-proxy-status'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '### 連携の母集団 (件数のみ・PII なし)' >> "$GITHUB_STEP_SUMMARY"
          # customers_no_email = App Proxy で ready にできない層 (確認カードに出す
          # マスク済 email が作れないため sync_pending 止まりになる = 実質の詰まり)
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM shopify_customers) AS customers_total,
              (SELECT COUNT(*) FROM shopify_customers WHERE email IS NOT NULL AND email LIKE '%_@_%._%') AS customers_with_email,
              (SELECT COUNT(*) FROM shopify_customers WHERE email IS NULL OR email NOT LIKE '%_@_%._%') AS customers_no_email,
              (SELECT COUNT(*) FROM friends WHERE shopify_customer_id IS NOT NULL) AS linked_friends,
              (SELECT COUNT(*) FROM shopify_customers WHERE friend_id IS NOT NULL) AS backlinked_customers,
              (SELECT COUNT(*) FROM friends) AS friends_total
          " | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### app-proxy トークン' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT
              COUNT(*) AS total,
              SUM(CASE WHEN consumed_at IS NOT NULL THEN 1 ELSE 0 END) AS consumed,
              SUM(CASE WHEN consumed_at IS NULL THEN 1 ELSE 0 END) AS pending
            FROM sub_link_tokens WHERE batch_id = 'app-proxy'
          " | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Disable App Proxy link (kill switch)
        if: inputs.op == 'disable-app-proxy-link'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # gate は `=== 'true'` の厳密一致なので 'false' で無効化される
          # (secret を消さずに残すことで、投入済みかどうかが secret list から追える)。
          # magic-link (SUB_LINK_ENABLED) は別 gate なので影響しない。
          TMP="$RUNNER_TEMP/secrets.app-proxy-off.json"
          printf '{"APP_PROXY_LINK_ENABLED":"false"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          echo '✅ APP_PROXY_LINK_ENABLED=false を投入 (= /proxy/line-link は 404 に戻る)' >> "$GITHUB_STEP_SUMMARY"

      - name: App Proxy probe (parameter-injection negative test, shape only)
        if: inputs.op == 'app-proxy-probe'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STOREFRONT_URL: ${{ inputs.storefront_url }}
        run: |
          set -euo pipefail
          # 架空の customer id (実顧客のデータには一切触れない)
          PROBE_ID=999999999999
          # storefront_url 未指定 = **listen-only モード**。
          # GitHub Actions の datacenter IP は Shopify 側で弾かれることがあり、runner から
          # 叩いた要求が worker に届かない。その場合は実端末から叩いてもらい、
          # ここは tail に流れてくるものを 75 秒観測するだけにする。
          LISTEN_ONLY=no
          if [ -z "$STOREFRONT_URL" ]; then
            LISTEN_ONLY=yes
            # 実端末からの発火とタイミングを合わせる余裕を持たせる
            PROBE_WINDOW=240
            echo "🎧 listen-only モード: 75 秒間 tail します。今のうちに実端末から" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "   \`<storefront>/apps/line-link?logged_in_customer_id=$PROBE_ID\` を開いてください" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          TAIL_LOG="$RUNNER_TEMP/tail.log"
          TAIL_ERR="$RUNNER_TEMP/tail.err"
          # tail を先に起動し、転送されてくる query を捕まえる。
          # stderr は捨てずに残す (潰すと「なぜ捕まらなかったか」が分からなくなる)。
          # リクエスト側を background に、tail を foreground の timeout 配下に置く。
          # kill (SIGTERM) だと wrangler の書き出しバッファが落ちることがあるので、
          # timeout に自然終了させて出力を確実にフラッシュさせる。
          (
            if [ "$LISTEN_ONLY" = "yes" ]; then exit 0; fi
            sleep 25
            for i in 1 2 3; do
              curl -s -o /dev/null "$STOREFRONT_URL/apps/line-link?logged_in_customer_id=$PROBE_ID" || true
              sleep 6
            done
          ) &
          timeout ${PROBE_WINDOW:-75} npx wrangler tail --format=json --search line-link > "$TAIL_LOG" 2> "$TAIL_ERR" || true
          wait || true
          # 該当リクエストの URL を 1 本だけ取り出す (署名も実 id も出力しない)
          LINE=$(grep -oE '"url": *"[^"]*line-link[^"]*"' "$TAIL_LOG" | head -1 || true)
          if [ -z "$LINE" ]; then
            {
              echo '⚠️ worker ログに該当リクエストが見つかりませんでした'
              echo ''
              echo "- tail に届いたイベント行数: $(wc -l < "$TAIL_LOG" | tr -d ' ')"
              echo '- wrangler stderr (先頭3行):'
              echo '```'
              head -3 "$TAIL_ERR" || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          COUNT=$(echo "$LINE" | grep -o 'logged_in_customer_id=' | wc -l | tr -d ' ')
          if echo "$LINE" | grep -q "logged_in_customer_id=$PROBE_ID"; then INJECTED=yes; else INJECTED=no; fi
          {
            echo '### App Proxy parameter-injection probe'
            echo ''
            echo "- logged_in_customer_id の出現回数: **$COUNT**"
            echo "- 注入値がそのまま残ったか: **$INJECTED**"
            echo ''
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -ge 2 ]; then
            echo '✅ Shopify が自分の値を追記 → 重複キー拒否が効く = 有効化して安全' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$INJECTED" = "no" ]; then
            echo '✅ Shopify が上書き → 注入が無効化される = 有効化して安全' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo '🚨 訪問者の値が温存されている — **有効化しないこと**。identity 設計の見直しが必要' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Backfill shopify_customers.friend_id (counts only)
        if: inputs.op == 'backfill-customer-friend-id'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '### Before (linked friends vs backlinked customers)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM friends WHERE shopify_customer_id IS NOT NULL) AS linked_friends, (SELECT COUNT(*) FROM shopify_customers WHERE friend_id IS NOT NULL) AS backlinked_customers" | tee -a "$GITHUB_STEP_SUMMARY"
          # 既存の friend_id を別値へ上書きする行があれば **停止する**。
          # 旧値は記録されないのでロールバック不能 + 注文 webhook 経路 (email 照合) が書いた
          # 値と食い違う可能性がある = 人間が中身を確認してから判断すべきケース。
          echo '### Rows whose friend_id would be OVERWRITTEN (must be 0 to proceed)' >> "$GITHUB_STEP_SUMMARY"
          OVERWRITE=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS overwrite_candidates FROM shopify_customers sc WHERE sc.friend_id IS NOT NULL AND EXISTS (SELECT 1 FROM friends f WHERE f.shopify_customer_id = sc.shopify_customer_id AND f.id != sc.friend_id)")
          echo "$OVERWRITE" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! echo "$OVERWRITE" | grep -q '"overwrite_candidates": 0'; then
            echo '❌ 既存 friend_id を上書きする行があります — 中身を確認してから手動で対応してください (backfill は中止)' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npx wrangler d1 execute naturism-line-crm --remote \
            --command "UPDATE shopify_customers SET friend_id = (SELECT f.id FROM friends f WHERE f.shopify_customer_id = shopify_customers.shopify_customer_id) WHERE EXISTS (SELECT 1 FROM friends f WHERE f.shopify_customer_id = shopify_customers.shopify_customer_id) AND (friend_id IS NULL OR friend_id != (SELECT f.id FROM friends f WHERE f.shopify_customer_id = shopify_customers.shopify_customer_id))"
          # runtime の writer (linkShopifyCustomerToFriend) は shopify_orders.friend_id も埋める。
          # ここを揃えないと、既存連携者の過去注文が friend_id NULL のまま残り、
          # 購買セグメント配信・ランク集計・出荷通知が対象を静かに取りこぼす。
          npx wrangler d1 execute naturism-line-crm --remote \
            --command "UPDATE shopify_orders SET friend_id = (SELECT f.id FROM friends f WHERE f.shopify_customer_id = shopify_orders.shopify_customer_id) WHERE friend_id IS NULL AND EXISTS (SELECT 1 FROM friends f WHERE f.shopify_customer_id = shopify_orders.shopify_customer_id)"
          # 2026-07-30: 発送レコードも注文経由で補完する。fulfillment webhook の旧実装が
          # friend_id を書き漏らしていた既存分 (LIFF 配送状況カードが空になる) の一括修復。
          npx wrangler d1 execute naturism-line-crm --remote \
            --command "UPDATE shopify_fulfillments SET friend_id = (SELECT so.friend_id FROM shopify_orders so WHERE so.shopify_order_id = shopify_fulfillments.shopify_order_id) WHERE friend_id IS NULL AND EXISTS (SELECT 1 FROM shopify_orders so WHERE so.shopify_order_id = shopify_fulfillments.shopify_order_id AND so.friend_id IS NOT NULL)"
          echo '### After (customers + orders + fulfillments)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM friends WHERE shopify_customer_id IS NOT NULL) AS linked_friends, (SELECT COUNT(*) FROM shopify_customers WHERE friend_id IS NOT NULL) AS backlinked_customers, (SELECT COUNT(*) FROM shopify_orders WHERE friend_id IS NULL AND shopify_customer_id IN (SELECT shopify_customer_id FROM friends WHERE shopify_customer_id IS NOT NULL)) AS orders_still_unlinked, (SELECT COUNT(*) FROM shopify_fulfillments WHERE friend_id IS NOT NULL) AS fulfillments_linked" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Shopify token scope probe (scope names only, read-only)
        if: inputs.op == 'shopify-scope-probe'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Client Credentials トークンの実効スコープを確認する (Draft Order 失敗等の一次切り分け)。
          # 出力は scope 名と有効期限のみ — token 値は SELECT しない。
          echo '### shopify_tokens (scope + expires only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT scope, expires_at FROM shopify_tokens WHERE id='default'" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delivery status diagnose (counts only, read-only)
        if: inputs.op == 'delivery-status-diagnose'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # LIFF 配送状況カードのデータ経路診断 (件数のみ・PII なし)。
          # 経路: Shopify webhook → shopify_orders/shopify_fulfillments (+friend_id 紐付け) → LIFF カード
          echo '### 1. Webhook 到達 (直近14日, topic×status 件数)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT topic, status, COUNT(*) AS n
            FROM shopify_webhook_log
            WHERE received_at >= datetime('now','-14 day')
            GROUP BY topic, status ORDER BY topic, status
          " | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### 2. 注文の friend 紐付け率 + financial_status 内訳 (直近14日)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT
              COUNT(*) AS orders_total,
              SUM(CASE WHEN friend_id IS NOT NULL THEN 1 ELSE 0 END) AS orders_linked,
              SUM(CASE WHEN friend_id IS NULL THEN 1 ELSE 0 END) AS orders_unlinked
            FROM shopify_orders WHERE created_at >= datetime('now','-14 day')
          " | tee -a "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT financial_status, fulfillment_status,
              COUNT(*) AS n,
              SUM(CASE WHEN friend_id IS NOT NULL THEN 1 ELSE 0 END) AS linked
            FROM shopify_orders WHERE created_at >= datetime('now','-14 day')
            GROUP BY financial_status, fulfillment_status
          " | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### 3. fulfillments の friend 紐付け率 (全期間)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT
              COUNT(*) AS fulfillments_total,
              SUM(CASE WHEN friend_id IS NOT NULL THEN 1 ELSE 0 END) AS linked,
              SUM(CASE WHEN friend_id IS NULL THEN 1 ELSE 0 END) AS unlinked
            FROM shopify_fulfillments
          " | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '### 読み方'
            echo '- 1 に orders/create が無い → webhook 未達 (Shopify 側の webhook 登録を確認)'
            echo '- orders_unlinked > 0 → 注文はあるが LINE 友だちに紐付いていない (メール/電話不一致。ストアログイン連携 or backfill-customer-friend-id で解消)'
            echo '- fulfillments unlinked > 0 → 発送レコードの紐付け漏れ (2026-07-30 修正デプロイ後の新規発送では発生しない想定)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rank discount status (counts only, read-only)
        if: inputs.op == 'rank-discount-status'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '### loyalty_rank_discounts (counts by status, no PII)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT status, COUNT(*) AS n FROM loyalty_rank_discounts GROUP BY status" | tee -a "$GITHUB_STEP_SUMMARY"

      # 決済リマインド gate (SUBSCRIPTION_REMINDER_ENABLED) を入れた場合の影響範囲を
      # 送信せずに見積もる read-only op。窓・除外条件・到達判定は実装
      # (subscription-billing-reminder.ts / channel-dispatcher.ts) と同じ述語を使う。
      # 出力は件数のみ (本リポジトリは public なので PII を出さない)。
      - name: Reminder dry-run (counts only, read-only, no sending)
        if: inputs.op == 'reminder-dry-run'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '### 決済リマインド dry-run (送信しません / 件数のみ)' >> "$GITHUB_STEP_SUMMARY"
          echo '窓 = 推定次回決済日が JST 今日+3 〜 +7 日。除外 = 解約済 / 一時停止中 / 同一推定日で送信済。' >> "$GITHUB_STEP_SUMMARY"
          echo '🚨 C2: さらに **Flow 実測 (estimate_source=flow) かつ受信 10 日以内**の契約のみが送信資格を持つ (導出 derived は送らない)。' >> "$GITHUB_STEP_SUMMARY"
          # migration 069/070 未適用なら fail せず「今どの段階か」を出して終了する
          # (billing-status と同じ ergonomics。テーブル不在で SQLITE_ERROR を投げても何も分からない)
          HAS=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='subscription_contracts'")
          if ! echo "$HAS" | grep -Eq '"n": *1'; then
            {
              echo ''
              echo '⚠️ **`subscription_contracts` テーブルが本番に存在しません** (migration 069/070 未適用)。'
              echo ''
              echo 'サブスク機能は「gate OFF」ではなく **未活性** の状態です。有効化は secret 1 つでは終わらず、'
              echo '次の順序が必要です (各段階で承認を取ること):'
              echo ''
              echo '1. migration 069 + 070 を適用 (テーブル作成のみ = additive・live-safe)'
              echo '   続けて `apply-migration-074` (実測アンカー列。実測を受け始める前に必須)'
              echo '2. `rebuild-subscription-contracts` で既存顧客タグから backfill'
              echo '   (**全 gate OFF のうちに済ませるのが最短**。収集 gate ON 後は force 入力が必要)'
              echo '3. `enable-subscription-ingest` — 収集のみ開始。**顧客に見える変化なし**'
              echo '   (ここで TEIKI_FLOW の実測日を貯める: docs/TEIKI_FLOW_SETUP.md)'
              echo '4. 本 op を再実行して「日付ソースの内訳」と到達件数を確認'
              echo '5. (日付が十分に埋まってから) `SUBSCRIPTION_MENU_ENABLED=true` — 顧客可視面を公開'
              echo '6. `SUBSCRIPTION_REMINDER_ENABLED=true` — ここで初めて push が飛び始める'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'subscription_contracts not found — see summary for the activation sequence'
            exit 0
          fi
          # C2 述語には migration 075 (flow_measured_at) が要る。未適用でも dry-run 自体は
          # 落とさず、「述語がまだ効かない」ことを警告して C2 抜きの窓だけ出す
          HAS_075=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('subscription_contracts') WHERE name='flow_measured_at'")
          if echo "$HAS_075" | grep -Eq '"n": *1'; then
            # due = listContractsDueForReminder (packages/db/src/subscription-contracts.ts) と同じ述語。
            # 片方を変えたら必ず両方変えること (定数の一致は
            # apps/worker/src/__tests__/admin-ops-c2-constants.test.ts が CI で検証する)。
            # ⚠️ due_eligible_c2 は「list が返す件数」であって送信数の上限ではない —
            # 送信直前の再導出検算 (staleEstimate) と実測限定の関門 (notMeasured) は
            # cron 内の JS でしか評価できないため、実際の送信数はこれ以下になりうる
            npx wrangler d1 execute naturism-line-crm --remote --json --command "
              WITH t AS (SELECT date('now','+9 hours') AS today, datetime('now','+9 hours','-10 day') AS floor),
              win AS (
                SELECT sc.* FROM subscription_contracts sc, t
                WHERE sc.next_billing_estimate >= date(t.today,'+3 day')
                  AND sc.next_billing_estimate <= date(t.today,'+7 day')
                  AND sc.cancelled_at IS NULL
                  AND sc.paused_at IS NULL
                  AND (sc.reminded_for_estimate IS NULL OR sc.reminded_for_estimate != sc.next_billing_estimate)
              ),
              due AS (
                SELECT w.* FROM win w, t
                WHERE w.estimate_source = 'flow'
                  AND w.flow_measured_at IS NOT NULL
                  AND w.flow_measured_at >= t.floor
              )
              SELECT
                (SELECT COUNT(*) FROM win) AS in_window_total,
                (SELECT COUNT(*) FROM due) AS due_eligible_c2,
                (SELECT COUNT(*) FROM win WHERE estimate_source != 'flow') AS excluded_derived,
                -- 「受信時刻が無い」(075 適用前からの flow 行 = 初期状態) と「期限切れ」
                -- (受信から 10 日超 = Flow の取りこぼし) は原因が違うので分けて出す。
                -- 合算すると 075 適用直後の正常な初期状態が障害に見える
                (SELECT COUNT(*) FROM win WHERE estimate_source = 'flow' AND flow_measured_at IS NULL)
                  AS excluded_no_measured_at,
                (SELECT COUNT(*) FROM win w, t WHERE w.estimate_source = 'flow'
                   AND w.flow_measured_at IS NOT NULL AND w.flow_measured_at < t.floor)
                  AS excluded_stale_measurement,
                (SELECT COUNT(*) FROM due WHERE shopify_customer_id IS NULL) AS no_customer_id,
                (SELECT COUNT(*) FROM due d JOIN friends f ON f.shopify_customer_id = d.shopify_customer_id) AS linked_to_friend,
                (SELECT COUNT(*) FROM due d JOIN friends f ON f.shopify_customer_id = d.shopify_customer_id
                   WHERE f.line_user_id IS NOT NULL AND f.is_following = 1 AND COALESCE(f.is_blacklisted,0) = 0)
                  AS would_actually_send
            " | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo '⚠️ **migration 075 未適用** — C2 の実測限定・鮮度述語がまだ効きません。`apply-migration-075` を実行してください。' >> "$GITHUB_STEP_SUMMARY"
            npx wrangler d1 execute naturism-line-crm --remote --json --command "
              WITH t AS (SELECT date('now','+9 hours') AS today),
              due AS (
                SELECT sc.contract_id, sc.shopify_customer_id, sc.next_billing_estimate, sc.estimate_source
                FROM subscription_contracts sc, t
                WHERE sc.next_billing_estimate >= date(t.today,'+3 day')
                  AND sc.next_billing_estimate <= date(t.today,'+7 day')
                  AND sc.cancelled_at IS NULL
                  AND sc.paused_at IS NULL
                  AND (sc.reminded_for_estimate IS NULL OR sc.reminded_for_estimate != sc.next_billing_estimate)
              )
              SELECT
                (SELECT COUNT(*) FROM due) AS in_window_total,
                (SELECT COUNT(*) FROM due WHERE estimate_source = 'flow') AS estimate_from_flow,
                (SELECT COUNT(*) FROM due WHERE estimate_source != 'flow') AS estimate_derived
            " | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # C2: MENU / REMINDER を開ける条件 (docs/SUBSCRIPTION_GATE_CRITERIA.md が正)。
          # ここで毎回機械判定することで「条件に達したか」を目視計算せずに追える。
          #
          # 🔄 2026-08-11 Katsu 決定: **条件1 (LINE 到達 > 30) と 条件2 (実測が過半) は撤廃**。
          # 判定列ごと削除してある — 使わない条件を 1/0 で出し続けると読む側が
          # 「まだ守っている壁」と誤解するため。
          # ⚠️ 撤廃した判定列の**識別子をこのファイルに書かないこと** (CI ガードが
          # ファイル全文の非包含で復活を検出するので、コメント内の言及でも赤くなる。
          # 識別子つきの説明は doc 側 = docs/SUBSCRIPTION_GATE_CRITERIA.md に置く)。
          # 撤廃の根拠は doc 側に確認記録つきで書いてある (derived の推定日はすべて「ごろ」+
          # 脚注で提示され、出せないときは日付を捏造しない = 条件2 が守っていたものは
          # 表現側の恒久ガードで代替できている)。
          # 数値そのものは linked_reachable_active / measured_active を**情報列**として残す
          # (Sprint A/C = 連携特典 ¥300 と magic-link メールの効果測定に使う)。
          # 復活させたくなったら doc とこの SQL を**必ず同時に**戻すこと
          # (admin-ops-c2-constants.test.ts が両方向の drift を CI で検出する)。
          #
          # ⚠️ measured_active に鮮度述語 (flow_measured_at) を**入れないこと**。前例なし層
          # (last_order_at 欠落・本番 active の約半数) は恒久的に 'flow' で、トリガー1 が
          # 決済 7 日前にしか発火しないため、周期の大半で実測は正当に「古い」。
          # 鮮度を混ぜると健常時でも過半に届かず、数字が実態より悲観的になる。
          # 代わりに fresh_measured_active を**情報列**として併記し、Flow 停止は crit3
          # (受信の生存) で捕まえる。
          echo '### gate 開放条件の判定 (C2) — 現在の阻止条件は 条件3 のみ' >> "$GITHUB_STEP_SUMMARY"
          echo '🔄 **2026-08-11 Katsu 決定で 条件1 (LINE 到達 > 30) と 条件2 (実測が過半) を撤廃**。条件1 = 開けること自体に実費も不可逆な公開影響もないため / 条件2 = 守っていたブランド毀損リスク (derived の推定日表示) を実 Flex で確認し、表現側 (「ごろ」+ 脚注 + 日付を捏造しない) の恒久ガードで代替できると確認したため。詳細と確認記録: docs/SUBSCRIPTION_GATE_CRITERIA.md' >> "$GITHUB_STEP_SUMMARY"
          echo '条件1/条件2 の **1/0 判定列は意図的に削除**した (使わない条件を 1/0 で出し続けると「まだ守っている壁」と誤読されるため)。実測値は `linked_reachable_active` / `measured_active` を**情報列**として残し、Sprint A/C の効果測定に使う。' >> "$GITHUB_STEP_SUMMARY"
          echo '条件3 = 直近 72h に実測受信あり (測定器の生存)。これが 0 だと開けても 1 通も飛ばない。' >> "$GITHUB_STEP_SUMMARY"
          echo '`fresh_measured_active` は参考値 (今この瞬間に送信資格を持つ実測数)。周期の大半で小さいのが正常 — `measured_active` と混同しないこと。' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            WITH a AS (
              SELECT * FROM subscription_contracts
              WHERE cancelled_at IS NULL AND paused_at IS NULL
            ),
            reach AS (
              SELECT COUNT(*) AS n FROM a x JOIN friends f ON f.shopify_customer_id = x.shopify_customer_id
              WHERE f.line_user_id IS NOT NULL AND f.is_following = 1 AND COALESCE(f.is_blacklisted,0) = 0
            ),
            meas AS (
              SELECT COUNT(*) AS n FROM a WHERE estimate_source = 'flow' AND next_billing_estimate IS NOT NULL
            ),
            ingest AS (
              SELECT COUNT(*) AS n FROM cron_run_logs
              WHERE job_name = 'teiki-flow-ingest' AND status = 'success'
                AND datetime(ran_at) >= datetime('now','+9 hours','-72 hours')
            )
            SELECT
              (SELECT COUNT(*) FROM a) AS active_total,
              (SELECT n FROM meas) AS measured_active,
              (SELECT COUNT(*) FROM a WHERE estimate_source = 'flow' AND next_billing_estimate IS NOT NULL
                 AND flow_measured_at IS NOT NULL
                 AND flow_measured_at >= datetime('now','+9 hours','-10 day')) AS fresh_measured_active,
              (SELECT n FROM reach) AS linked_reachable_active,
              (SELECT n FROM ingest) AS ingest_success_72h,
              CASE WHEN (SELECT n FROM ingest) > 0 THEN 1 ELSE 0 END AS crit3_ingest_alive_72h
          " | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### 参考: 全契約の内訳 (窓に関係なく)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT
              COUNT(*) AS contracts_total,
              SUM(CASE WHEN cancelled_at IS NULL AND paused_at IS NULL THEN 1 ELSE 0 END) AS active,
              SUM(CASE WHEN next_billing_estimate IS NULL THEN 1 ELSE 0 END) AS no_estimate
            FROM subscription_contracts
          " | tee -a "$GITHUB_STEP_SUMMARY"
          # 窓が 0 件だったとき「推定日が古いのか / 先なのか / そもそも出せないのか」を切り分ける。
          # ここが無いと 0 の意味 (機能が壊れている / まだデータが無い / 単に該当者不在) が読めない。
          echo '### 推定日の分布 (active のみ・件数)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            WITH t AS (SELECT date('now','+9 hours') AS today)
            SELECT
              SUM(CASE WHEN sc.next_billing_estimate < t.today THEN 1 ELSE 0 END) AS past,
              SUM(CASE WHEN sc.next_billing_estimate >= t.today AND sc.next_billing_estimate < date(t.today,'+3 day') THEN 1 ELSE 0 END) AS d0_2,
              SUM(CASE WHEN sc.next_billing_estimate >= date(t.today,'+3 day') AND sc.next_billing_estimate <= date(t.today,'+7 day') THEN 1 ELSE 0 END) AS d3_7_window,
              SUM(CASE WHEN sc.next_billing_estimate > date(t.today,'+7 day') AND sc.next_billing_estimate <= date(t.today,'+30 day') THEN 1 ELSE 0 END) AS d8_30,
              SUM(CASE WHEN sc.next_billing_estimate > date(t.today,'+30 day') THEN 1 ELSE 0 END) AS beyond_30
            FROM subscription_contracts sc, t
            WHERE sc.next_billing_estimate IS NOT NULL
              AND sc.cancelled_at IS NULL AND sc.paused_at IS NULL
          " | tee -a "$GITHUB_STEP_SUMMARY"
          # §10-0 ①: TEIKI_FLOW を設定したら実測 (flow) が増えることをここで確認する。
          # active 全体で見るのは、実測が最も効く層 (推定日を出せない契約) が窓の外にいるため。
          echo '### 日付ソースの内訳 (active のみ・件数) — TEIKI_FLOW 設定の効果測定' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT
              SUM(CASE WHEN estimate_source = 'flow' AND next_billing_estimate IS NOT NULL THEN 1 ELSE 0 END) AS measured_by_flow,
              SUM(CASE WHEN estimate_source != 'flow' AND next_billing_estimate IS NOT NULL THEN 1 ELSE 0 END) AS derived_estimate,
              SUM(CASE WHEN next_billing_estimate IS NULL THEN 1 ELSE 0 END) AS no_date
            FROM subscription_contracts
            WHERE cancelled_at IS NULL AND paused_at IS NULL
          " | tee -a "$GITHUB_STEP_SUMMARY"
          # migration 074 の健全性。実測アンカーが無い flow 行は、スキップが推定へ反映されない
          # (= スキップ済みの顧客へ古い決済日を送る経路)。0 であるべき数値を明示する。
          HAS_ANCHOR=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('subscription_contracts') WHERE name='flow_estimate_anchor'")
          if echo "$HAS_ANCHOR" | grep -Eq '"n": *1'; then
            echo '### 実測アンカーの健全性 (migration 074) — anchor_missing は 0 であるべき' >> "$GITHUB_STEP_SUMMARY"
            npx wrangler d1 execute naturism-line-crm --remote --json --command "
              SELECT
                SUM(CASE WHEN estimate_source='flow' AND next_billing_estimate IS NOT NULL
                          AND flow_estimate_anchor IS NULL THEN 1 ELSE 0 END) AS anchor_missing,
                SUM(CASE WHEN estimate_source='flow' AND skip_count > skip_count_at_estimate THEN 1 ELSE 0 END) AS pending_skip_shift,
                SUM(CASE WHEN estimate_source='flow' AND skip_count > skip_count_at_estimate
                          AND interval_days IS NULL THEN 1 ELSE 0 END) AS shift_blocked_no_interval
              FROM subscription_contracts
              WHERE cancelled_at IS NULL AND paused_at IS NULL
            " | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo '### ⚠️ migration 074 未適用 — `apply-migration-074` を実行してください' >> "$GITHUB_STEP_SUMMARY"
            echo '(実測を受け始める前に必須。未適用のまま実測が入ると、その後のスキップが推定に反映されません)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '### 推定日を出せない理由 (active のみ・件数)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT
              COUNT(*) AS active_total,
              SUM(CASE WHEN next_billing_estimate IS NULL AND interval_days IS NULL THEN 1 ELSE 0 END) AS no_interval,
              SUM(CASE WHEN next_billing_estimate IS NULL AND last_order_at IS NULL THEN 1 ELSE 0 END) AS no_last_order,
              SUM(CASE WHEN next_billing_estimate IS NULL THEN 1 ELSE 0 END) AS no_estimate_total
            FROM subscription_contracts
            WHERE cancelled_at IS NULL AND paused_at IS NULL
          " | tee -a "$GITHUB_STEP_SUMMARY"

      # サブスク契約テーブルの活性化 step 1/5 (SESSION_HANDOFF「活性化シーケンス」)。
      # 069 = CREATE TABLE IF NOT EXISTS + index (完全 idempotent)
      # 070 = ALTER TABLE ADD COLUMN ×2 (**idempotent でない** — 既に列があると
      #       "duplicate column name" で落ちるので、列の有無を見てから流す)
      # どちらも additive で既存データに触れない (DROP/DELETE/UPDATE を含まない)。
      - name: Apply migration 069 + 070 (subscription contracts, additive)
        if: inputs.op == 'apply-migration-069-070'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '### 069 (subscription_contracts + index)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote \
            --file ../../packages/db/migrations/069_subscription_contracts.sql

          # 070 は ADD COLUMN なので、適用済みなら skip する (再実行で落とさない)
          COLS=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('subscription_contracts') WHERE name IN ('recovery_pending_at','recovery_notified_at')")
          if echo "$COLS" | grep -Eq '"n": *2'; then
            echo '### 070: 適用済み (recovery 列が既に存在) — skip' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### 070 (recovery_pending_at / recovery_notified_at)' >> "$GITHUB_STEP_SUMMARY"
            npx wrangler d1 execute naturism-line-crm --remote \
              --file ../../packages/db/migrations/070_subscription_recovery.sql
          fi

          echo '### 検証: テーブルと列' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='subscription_contracts'" | tee -a "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS columns_total, SUM(CASE WHEN name LIKE 'recovery_%' THEN 1 ELSE 0 END) AS recovery_columns FROM pragma_table_info('subscription_contracts')" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### 検証: 行数 (適用直後は 0 のはず = 既存データに触れていない)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS rows FROM subscription_contracts" | tee -a "$GITHUB_STEP_SUMMARY"

      # 実測アンカー列の追加 (migration 074)。ALTER TABLE ADD COLUMN ×2 なので
      # **idempotent でない** — 069+070 と同じく列の有無を見てから流す。
      # 末尾の UPDATE は既存行の基準値を現累計に揃えるだけ (行の追加・削除・日付の変更なし)。
      # これが無いと、適用直後の refreshEstimate が「基準値 0 vs skip 累計 n」を
      # 未消化スキップと誤認し、n 周期ぶん一気に先送りする。
      - name: Apply migration 074 (flow estimate anchor, additive)
        if: inputs.op == 'apply-migration-074'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          HAS_TABLE=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='subscription_contracts'")
          if ! echo "$HAS_TABLE" | grep -Eq '"n": *1'; then
            echo '❌ subscription_contracts がありません — apply-migration-069-070 を先に実行してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          COLS=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('subscription_contracts') WHERE name IN ('flow_estimate_anchor','skip_count_at_estimate')")
          if echo "$COLS" | grep -Eq '"n": *2'; then
            echo '### 074: 適用済み (anchor 列が既に存在) — skip' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### 074 (flow_estimate_anchor / skip_count_at_estimate)' >> "$GITHUB_STEP_SUMMARY"
            npx wrangler d1 execute naturism-line-crm --remote \
              --file ../../packages/db/migrations/074_subscription_flow_anchor.sql
          fi

          echo '### 検証: 列と初期化状態' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS anchor_columns FROM pragma_table_info('subscription_contracts') WHERE name IN ('flow_estimate_anchor','skip_count_at_estimate')" | tee -a "$GITHUB_STEP_SUMMARY"
          # baseline_drift は 0 であるべき (>0 なら初期化 UPDATE が流れていない = 先送り誤発生の恐れ)。
          # anchor_missing は「実測なのにアンカーが無い行」= 0 であるべき。
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "
              SELECT
                SUM(CASE WHEN skip_count_at_estimate != skip_count THEN 1 ELSE 0 END) AS baseline_drift,
                SUM(CASE WHEN estimate_source='flow' AND next_billing_estimate IS NOT NULL
                          AND flow_estimate_anchor IS NULL THEN 1 ELSE 0 END) AS anchor_missing,
                COUNT(*) AS contracts_total
              FROM subscription_contracts
            " | tee -a "$GITHUB_STEP_SUMMARY"

      # 実測の受信時刻列 (migration 075、C2)。ALTER TABLE ADD COLUMN ×1 のみ =
      # 既存データに一切触れない (意図的に初期化 UPDATE をしない: 既存 flow 行の受信時刻は
      # 不明であり、不明を「新しい」とみなすのは C2 の趣旨に反する。NULL のままなら
      # 送信対象外で、次の Flow 発火で時刻付き実測に置き換わる)。
      #
      # 🚨 **C2 のコードを deploy する前に適用すること**。影響は teiki-flow だけではない —
      # upsertSubscriptionContract は INSERT 列リストに flow_measured_at を静的に含むため、
      # 未適用の D1 では **契約 read-model への全書込が no such column で失敗する**
      # (webhook 由来の導出・teiki-flow 受信・rebuild すべて)。収集は現在 LIVE なので、
      # 順序を誤ると収集が丸ごと止まる。
      - name: Apply migration 075 (flow measured at, additive)
        if: inputs.op == 'apply-migration-075'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          HAS_TABLE=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='subscription_contracts'")
          if ! echo "$HAS_TABLE" | grep -Eq '"n": *1'; then
            echo '❌ subscription_contracts がありません — apply-migration-069-070 を先に実行してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          HAS_074=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('subscription_contracts') WHERE name='flow_estimate_anchor'")
          if ! echo "$HAS_074" | grep -Eq '"n": *1'; then
            echo '❌ migration 074 が未適用です — apply-migration-074 を先に実行してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          HAS_075=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('subscription_contracts') WHERE name='flow_measured_at'")
          if echo "$HAS_075" | grep -Eq '"n": *1'; then
            echo '### 075: 適用済み (flow_measured_at 列が既に存在) — skip' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### 075 (flow_measured_at)' >> "$GITHUB_STEP_SUMMARY"
            npx wrangler d1 execute naturism-line-crm --remote \
              --file ../../packages/db/migrations/075_flow_measured_at.sql
          fi

          echo '### 検証: 列の存在 + 行数不変の確認 (件数のみ)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('subscription_contracts') WHERE name='flow_measured_at') AS column_present, (SELECT COUNT(*) FROM subscription_contracts) AS contracts_total, (SELECT COUNT(*) FROM subscription_contracts WHERE flow_measured_at IS NOT NULL) AS measured_at_set" | tee -a "$GITHUB_STEP_SUMMARY"

      # C2 同梱の診断 op: 契約 1 件の read-model を D1 から読み、Shopify 画面
      # (定期購買一覧 → 契約詳細の「次回ご注文日」) と一致するかを一発で照合する。
      # **読み取り専用** (SELECT のみ)。本リポジトリは public のため出力に顧客識別子は
      # 含めない (契約 ID は不透明な数値、日付・件数・真偽値のみ)。
      - name: Diagnose one subscription contract (read-only, no PII)
        if: inputs.op == 'contract-diagnose'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTRACT_ID_INPUT: ${{ inputs.contract_id }}
        run: |
          set -euo pipefail
          if [ -z "${CONTRACT_ID_INPUT:-}" ]; then
            echo 'contract_id 入力が必要です (素の数値 か gid://shopify/SubscriptionContract/<数値>)' >&2
            exit 1
          fi
          # GID なら末尾セグメントに正規化 (受信 route の resolveContractRow と同じ規則)。
          # 🚨 検証に grep を使わないこと — grep は**行単位**なので、改行を含む入力は
          # 1 行目さえ英数字なら通ってしまう。`##*/` は改行をまたいで剥がすため、
          # `.../123\n'; UPDATE ...` が `123\n'; UPDATE ...` として残り、下の SELECT の
          # 文字列リテラルを途中終端して**読み取り専用の宣言を破る書込**が本番 D1 に流れる
          # (wrangler --command は `;` 区切りの複数文を実行する)。
          # case は文字列全体をパターンマッチするので改行も非許可文字として弾ける。
          CID="${CONTRACT_ID_INPUT##*/}"
          case "$CID" in
            ''|*[!A-Za-z0-9_-]*)
              echo "contract_id の形式が不正です (英数字・ハイフン・アンダースコアのみ)" >&2
              exit 1
              ;;
          esac
          HAS_075=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('subscription_contracts') WHERE name='flow_measured_at'")
          if ! echo "$HAS_075" | grep -Eq '"n": *1'; then
            echo '❌ migration 075 が未適用です — apply-migration-075 を先に実行してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          FOUND=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM subscription_contracts WHERE contract_id='$CID'")
          if ! echo "$FOUND" | grep -Eq '"n": *1'; then
            {
              echo "### ❌ 契約 $CID は read-model に存在しません"
              echo ''
              echo '- 入力の桁を確認 (Shopify 画面の契約番号から `#` を除いた数値)'
              echo '- 収集開始 (2026-08-02) 以前に作られ、その後 webhook が一度も来ていない契約は'
              echo '  read-model に無いことがあります → `rebuild-subscription-contracts` で backfill 可能'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "contract $CID not found — see summary"
            exit 0
          fi

          echo "### 契約 $CID の read-model (Shopify 画面と照合する値)" >> "$GITHUB_STEP_SUMMARY"
          echo '`next_billing_estimate` を契約詳細の「**次回ご注文日**」と比較してください (画面は和暦風表記、こちらは YYYY-MM-DD)。' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            SELECT
              contract_id,
              next_billing_estimate,
              estimate_source,
              flow_estimate_anchor,
              flow_measured_at,
              interval_days,
              order_count,
              skip_count, skip_count_at_estimate, skip_count_at_last_order,
              substr(last_order_at, 1, 10) AS last_order_date,
              CASE WHEN paused_at IS NULL THEN 0 ELSE 1 END AS is_paused,
              CASE WHEN cancelled_at IS NULL THEN 0 ELSE 1 END AS is_cancelled,
              reminded_for_estimate
            FROM subscription_contracts WHERE contract_id='$CID'
          " | tee -a "$GITHUB_STEP_SUMMARY"

          # 送信時の再導出検算 (A-1 / #229) と同じ計算を SQL で再現し、drift を露出する。
          # 検算は flow 行のみ (derived の導出は last_order_at の TZ 正規化が絡むため
          # JS 側の関門が authoritative。C2 以降 derived はそもそも送信対象外)
          echo '### 実測検算 (列 == アンカーから導ける値 か)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            WITH c AS (SELECT * FROM subscription_contracts WHERE contract_id='$CID'),
            e AS (
              SELECT estimate_source, next_billing_estimate,
                CASE
                  WHEN cancelled_at IS NOT NULL OR paused_at IS NOT NULL THEN NULL
                  WHEN flow_estimate_anchor IS NULL THEN NULL
                  WHEN skip_count <= skip_count_at_estimate THEN flow_estimate_anchor
                  WHEN interval_days IS NULL THEN NULL
                  ELSE date(flow_estimate_anchor, '+' || (interval_days * (skip_count - skip_count_at_estimate)) || ' day')
                END AS expected
              FROM c
            )
            SELECT
              CASE WHEN estimate_source != 'flow' THEN 'n/a (flow 行のみ検算)'
                   WHEN expected IS next_billing_estimate THEN 'consistent'
                   ELSE 'MISMATCH (送信時は staleEstimate ガードで無送信になる)'
              END AS flow_recompute
            FROM e
          " | tee -a "$GITHUB_STEP_SUMMARY"

          echo '### リマインド資格の内訳 (C2 述語をこの契約に適用した結果)' >> "$GITHUB_STEP_SUMMARY"
          echo '送信されるのは: window_position=in_window かつ source_ok/measurement_fresh/active_ok=1 かつ already_reminded=0 かつ line_reachable=1 の時のみ。' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json --command "
            WITH t AS (SELECT date('now','+9 hours') AS today, datetime('now','+9 hours','-10 day') AS floor),
            c AS (SELECT * FROM subscription_contracts WHERE contract_id='$CID')
            SELECT
              CASE WHEN c.next_billing_estimate IS NULL THEN 'no_date'
                   WHEN c.next_billing_estimate < date(t.today, '+3 day') THEN 'before_window'
                   WHEN c.next_billing_estimate <= date(t.today, '+7 day') THEN 'in_window'
                   ELSE 'after_window' END AS window_position,
              CASE WHEN c.estimate_source = 'flow' THEN 1 ELSE 0 END AS source_ok,
              CASE WHEN c.flow_measured_at IS NOT NULL AND c.flow_measured_at >= t.floor THEN 1 ELSE 0 END AS measurement_fresh,
              CASE WHEN c.cancelled_at IS NULL AND c.paused_at IS NULL THEN 1 ELSE 0 END AS active_ok,
              CASE WHEN c.reminded_for_estimate IS NOT NULL AND c.reminded_for_estimate = c.next_billing_estimate THEN 1 ELSE 0 END AS already_reminded,
              (SELECT COUNT(*) FROM friends f
                WHERE f.shopify_customer_id = c.shopify_customer_id
                  AND f.line_user_id IS NOT NULL AND f.is_following = 1
                  AND COALESCE(f.is_blacklisted, 0) = 0) AS line_reachable
            FROM c, t
          " | tee -a "$GITHUB_STEP_SUMMARY"

      # サブスク契約テーブルの活性化 step 2/5。既存 D1 (shopify_orders / shopify_customers) の
      # タグから read-model を導出する backfill。**Shopify API は叩かない**・冪等・送信ゼロ。
      # 設計上の順序は「migration → rebuild → gate ON」(routes/shopify.ts のコメント)。
      # gate ON 前に read-model を温めておかないと gate ON 直後に空カードが出る。
      # 出力は件数のみ (本リポジトリは public。firstError は生データ混入の恐れがあるため
      # 有無のみを出す)。
      #
      # ⚠️ **収集 gate (INGEST / MENU) が ON の状態での再実行は 409 で拒否される**。
      # 収集中は customers/update がスキップの先送り (skip_count と skip_count_at_last_order の
      # drift) を書き続けており、rebuild の pass3 はそれを正規化して**恒久的に消す**ため
      # (履歴から復元不能 = スキップ済みの顧客に 1 周期早いリマインドが飛ぶ)。
      # 承知の上で実行する場合のみ入力 `force` に true を指定すること。
      - name: Rebuild subscription contracts (backfill, no sending)
        if: inputs.op == 'rebuild-subscription-contracts'
        env:
          WORKER_API_KEY_VALUE: ${{ secrets.WORKER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_API_KEY_VALUE:-}" ]; then
            echo "Repository secret WORKER_API_KEY が未設定です" >&2
            exit 1
          fi
          URL="https://naturism-line-crm.katsu-7d5.workers.dev/api/integrations/shopify/subscription-contracts/rebuild"
          if [ "${FORCE:-false}" = "true" ]; then
            URL="$URL?force=1"
            echo '⚠️ force=1 で実行 (未消化スキップの先送りを巻き戻す可能性を承知の上)' >> "$GITHUB_STEP_SUMMARY"
          fi
          RESP=$(curl -sS -X POST "$URL" -H "Authorization: Bearer $WORKER_API_KEY_VALUE")
          echo '### rebuild 結果 (件数のみ)' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" | node -e '
            let raw = "";
            process.stdin.on("data", (d) => (raw += d));
            process.stdin.on("end", () => {
              let j;
              try { j = JSON.parse(raw); } catch { console.log("JSON parse 失敗 (本文は伏せます)"); process.exit(1); }
              if (!j.success) {
                // 409 (収集 gate ON による拒否) だけは脱出口を出す。固定文言なので PII は混ざらない。
                // これが無いと operator には赤い step と「詳細は伏せます」しか残らない。
                const gated = typeof j.error === "string" && /force=1/.test(j.error);
                console.log(gated
                  ? "⏸ 収集 gate が ON のため拒否されました (未消化スキップの先送りを消す恐れ)。意図的に実行する場合は Run workflow の force に true を指定して再実行してください。"
                  : "success=false (詳細は伏せます)");
                process.exit(1);
              }
              const d = j.data || {};
              const keys = ["ordersScanned","ordersFailed","skippedNonWebhook","contractsSeen","customersScanned","customersFailed","baselinesNormalized","truncated"];
              for (const k of keys) console.log(`- ${k}: ${d[k]}`);
              console.log(`- hasError: ${d.firstError ? "yes (内容は伏せます)" : "no"}`);
            });
          ' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### 検証: 作成された契約行数' >> "$GITHUB_STEP_SUMMARY"
          cd apps/worker && npx wrangler d1 execute naturism-line-crm --remote --json             --command "SELECT COUNT(*) AS contracts, SUM(CASE WHEN cancelled_at IS NULL AND paused_at IS NULL THEN 1 ELSE 0 END) AS active, SUM(CASE WHEN next_billing_estimate IS NOT NULL THEN 1 ELSE 0 END) AS with_estimate FROM subscription_contracts" | tee -a "$GITHUB_STEP_SUMMARY"

      # §10-0 ①: 契約データの「収集」だけを先に開始する gate。
      # 顧客に見える面 (トーク内の契約カード / サブスク intent / リッチメニュー v4) は
      # SUBSCRIPTION_MENU_ENABLED のままなので、この op では顧客の体験は一切変わらない。
      # 収集を先に回して TEIKI_FLOW の実測日を貯めてから MENU を開けるのが正しい順序
      # (逆にすると、推定日を出せない契約のカードを顧客に見せることになる)。
      - name: Enable subscription ingest (collection only, no customer-visible change)
        if: inputs.op == 'enable-subscription-ingest'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 前提 migration の確認 (兄弟 op と同じ ergonomics)。
          # 069/070 未適用なら書込が `no such table`、074 未適用なら INSERT が
          # `no such column: flow_estimate_anchor` で全例外になる。webhook 経路は catch で
          # 完全に無音、teiki-flow は 500 で Flow に無駄な 5xx リトライをさせるため、
          # 「収集を開始したのに 1 件も入らない」状態を作ってしまう。ON にする前に止める。
          COLS=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('subscription_contracts') WHERE name IN ('flow_estimate_anchor','skip_count_at_estimate')")
          if ! echo "$COLS" | grep -Eq '"n": *2'; then
            {
              echo '❌ 前提 migration が未適用です (収集を開始しても書込が全て失敗します)'
              echo ''
              echo '`apply-migration-069-070` → `apply-migration-074` を先に実行してください。'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # secret bulk (JSON) で投入する — `"値" | wrangler secret put` は末尾 CR が残り
          # gate の厳密一致 (=== 'true') を静かに外す (memory: wrangler_secret_powershell_crlf)
          TMP="$RUNNER_TEMP/secrets.sub-ingest-on.json"
          printf '{"SUBSCRIPTION_INGEST_ENABLED":"true"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          {
            echo '✅ SUBSCRIPTION_INGEST_ENABLED=true を投入'
            echo ''
            echo '- Shopify webhook (orders/customers) からの契約 read-model 導出が開始'
            echo '- `/api/integrations/teiki-flow` が Flow の実測値を受理開始 (要 TEIKI_FLOW_SECRET)'
            echo '- **顧客に見える変化なし** (契約カード / intent / リマインドは別 gate のまま)'
            echo '- 収集のみの期間はリカバリマーカーを立てない = MENU を開けた瞬間の一斉送信を防ぐ'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disable subscription ingest (kill switch)
        if: inputs.op == 'disable-subscription-ingest'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/secrets.sub-ingest-off.json"
          printf '{"SUBSCRIPTION_INGEST_ENABLED":"false"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          {
            echo '✅ SUBSCRIPTION_INGEST_ENABLED=false を投入'
            echo ''
            echo '⚠️ SUBSCRIPTION_MENU_ENABLED=true が別に入っている場合、収集は MENU 側で'
            echo '継続する (MENU は収集を含む)。完全停止するには MENU も落とすこと。'
          } >> "$GITHUB_STEP_SUMMARY"

      # 商品ファクト系 auto_replies (違い/アレルギー/成分) を公式サイトの単一真実へ更新。
      # auto_replies は intent-router / AI 応答より優先して返るため、ソースを直すだけでは
      # 本番の回答が変わらない。v3 と同じ非破壊パターン (旧行 is_active=0 → 新行 INSERT)。
      # 冪等ではない (再実行すると新行も無効化される) ので、適用済みなら skip する。
      - name: Apply naturism FAQ v4 (product facts)
        if: inputs.op == 'apply-faq-v4'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          APPLIED=$(npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS n FROM auto_replies WHERE is_active=1 AND response_content LIKE '%Blue（9成分）%'")
          if echo "$APPLIED" | grep -Eq '"n": *[1-9]'; then
            echo '### FAQ v4: 適用済み (Blue（9成分）の行が有効) — skip' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### FAQ v4 を適用 (違い / アレルギー / 成分)' >> "$GITHUB_STEP_SUMMARY"
            npx wrangler d1 execute naturism-line-crm --remote \
              --file ../../packages/db/seed-naturism-faq-v4.sql
          fi

          echo '### 検証: 対象キーワードの有効行 (件数のみ)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT keyword, COUNT(*) AS active_rows FROM auto_replies WHERE is_active=1 AND keyword IN ('違い','アレルギー','成分') GROUP BY keyword" \
            >> "$GITHUB_STEP_SUMMARY"
          # 撤回済み表現の残存チェック。SQLite の LIKE では % がワイルドカードなので、
          # 「100%天然由来」のように文字列自体に % を含むパターンは使わない
          # (誤検知するため、% を含まない一意な部分文字列で判定する)。
          echo '### 検証: 撤回済み表現の残存 (0 であること)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT COUNT(*) AS stale FROM auto_replies WHERE is_active=1 AND (response_content LIKE '%天然由来・国内製造%' OR response_content LIKE '%天然由来成分のみ%' OR response_content LIKE '%人工甘味料%' OR response_content LIKE '%脂質カット特化%' OR response_content LIKE '%糖質カット最強%' OR response_content LIKE '%Blue（8成分）%' OR response_content LIKE '%動物性原料は一切%' OR response_content LIKE '%フォトカードキャンペーン%')" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '### 検証: auto_replies 以外の D1 (0 であること)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute naturism-line-crm --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM purchase_cross_sell_map WHERE reason LIKE '%8成分のシンプル定番ライン%' OR reason LIKE '%酵素360mg%' OR reason LIKE '%糖質ケア%') AS cross_sell_stale, (SELECT COUNT(*) FROM scenario_steps WHERE message_content LIKE '%成分配合%' AND message_content NOT LIKE '%9 成分配合%') AS scenario_stale, (SELECT COUNT(*) FROM nutrition_sku_map WHERE copy_template LIKE '%糖質対応%') AS nutrition_stale" \
            >> "$GITHUB_STEP_SUMMARY"

      # 定期便系 FAQ の本番監査 (read-only)。チャット自動応答 (auto_replies) と
      # LIFF FAQ タブ (faq_items) の「定期/解約/スキップ」有効行が実態
      # (定期便のスキップ/お届け日変更/解約はマイページ「定期購買一覧」のみ・LINE 内では実行不可、
      #  Shop タブの「定期お届けリマインダー」は再注文リマインドで定期便契約とは別物) と
      # 整合しているかを、件数と指紋 (既知文言の LIKE) だけで判定する。
      # あわせて AI 応答モデルの実測分布 (conversation_logs.ai_model) を出す。
      # ⚠️ repo は PUBLIC — 回答本文・顧客データはログに出さない (COUNT / keyword / category / model 名のみ)。
      # ⚠️ LIKE パターンは D1 の 50 バイト制限内に収めること (日本語 1 文字 = 3 バイト)。
      - name: FAQ subscription audit (read-only)
        if: inputs.op == 'faq-subscription-audit'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          D1() { npx wrangler d1 execute naturism-line-crm --remote --json --command "$1" >> "$GITHUB_STEP_SUMMARY"; }
          echo '## FAQ 定期便系監査 (read-only・本文は出さない)' >> "$GITHUB_STEP_SUMMARY"

          echo '### 1. auto_replies: 定期系キーワード行 (keyword × is_active)' >> "$GITHUB_STEP_SUMMARY"
          D1 "SELECT keyword, is_active, COUNT(*) AS rows FROM auto_replies WHERE keyword LIKE '%定期%' OR keyword LIKE '%解約%' OR keyword LIKE '%スキップ%' OR keyword LIKE '%休止%' OR keyword LIKE '%サブスク%' GROUP BY keyword, is_active ORDER BY keyword, is_active"

          echo '### 2. v3 正文の指紋 (期待値 4 = 解約/定期便/スキップ/休止 の有効行が全て v3 文言)' >> "$GITHUB_STEP_SUMMARY"
          D1 "SELECT COUNT(*) AS v3_fingerprint_ok FROM auto_replies WHERE is_active=1 AND keyword IN ('解約','定期便','スキップ','休止') AND response_content LIKE '%マイページから24時間%' AND response_content LIKE '%定期購買一覧%'"

          echo '### 3. 旧/誤誘導表現の残存 (期待値 全て 0)' >> "$GITHUB_STEP_SUMMARY"
          D1 "SELECT SUM(CASE WHEN response_content LIKE '%10日前までにご連絡%' THEN 1 ELSE 0 END) AS old_dmm_cancel, SUM(CASE WHEN response_content LIKE '%お休みプラン%' THEN 1 ELSE 0 END) AS old_rest_plan, SUM(CASE WHEN response_content LIKE '%LINEから解約%' OR response_content LIKE '%LINEで解約%' THEN 1 ELSE 0 END) AS line_cancel_claim, SUM(CASE WHEN response_content LIKE '%定期お届けリマインダー%' THEN 1 ELSE 0 END) AS reminder_confusion FROM auto_replies WHERE is_active=1"

          echo '### 4. 定期の操作に言及する有効行の総数 (期待値 4。5 以上 = 未知の行あり → 本文の個別確認が必要)' >> "$GITHUB_STEP_SUMMARY"
          D1 "SELECT COUNT(*) AS mentions_subscription_ops FROM auto_replies WHERE is_active=1 AND response_content LIKE '%定期%' AND (response_content LIKE '%解約%' OR response_content LIKE '%スキップ%')"

          echo '### 5. faq_items (LIFF FAQ タブ): category × is_active' >> "$GITHUB_STEP_SUMMARY"
          D1 "SELECT category, is_active, COUNT(*) AS rows FROM faq_items GROUP BY category, is_active ORDER BY category, is_active"

          echo '### 6. faq_items 定期系有効行の指紋 (without_mypage / line_cancel_claim が 0 でなければ要本文確認)' >> "$GITHUB_STEP_SUMMARY"
          D1 "SELECT COUNT(*) AS subs_rows, SUM(CASE WHEN answer LIKE '%マイページ%' THEN 1 ELSE 0 END) AS with_mypage, SUM(CASE WHEN answer NOT LIKE '%マイページ%' THEN 1 ELSE 0 END) AS without_mypage, SUM(CASE WHEN answer LIKE '%LINEから解約%' OR answer LIKE '%LINEで解約%' THEN 1 ELSE 0 END) AS line_cancel_claim, SUM(CASE WHEN answer LIKE '%定期お届けリマインダー%' THEN 1 ELSE 0 END) AS mentions_reminder FROM faq_items WHERE is_active=1 AND (question LIKE '%定期%' OR answer LIKE '%定期%' OR question LIKE '%解約%' OR answer LIKE '%解約%' OR question LIKE '%スキップ%' OR answer LIKE '%スキップ%')"

          echo '### 7. AI 応答モデルの実測 (直近30日・conversation_logs・model 名と件数のみ)' >> "$GITHUB_STEP_SUMMARY"
          D1 "SELECT ai_layer, ai_model, COUNT(*) AS n FROM conversation_logs WHERE created_at >= date('now','-30 day') GROUP BY ai_layer, ai_model ORDER BY n DESC"

      # ダッシュボード system.failingJobs に出た cron の一次切り分け (read-only)。
      # 「どの job が」だけ分かっても原因は分からないので、error_summary の実物と
      # 外形 probe を 1 op で並べる。
      # ⚠️ repo は PUBLIC — error_summary を出すのは ai-models-catalog-sync だけに限定する
      #    (この job の error_summary は実装が生成する内部文字列のみ = PII なし。
      #     他 job は未知の文字列を含み得るので件数だけにする)。
      - name: Cron failure diagnose (read-only)
        if: inputs.op == 'cron-failure-diagnose'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # tee: wrangler のエラーは stdout に出る。`>>` だけだと summary に飲まれて
          # ログ側が「exit 1 とだけ言う無言の失敗」になる。
          D1() { npx wrangler d1 execute naturism-line-crm --remote --json --command "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          echo '## cron 失敗の一次切り分け (read-only)' >> "$GITHUB_STEP_SUMMARY"

          # ran_at は JST 文字列で入る (schema の DEFAULT が '+9 hours') ので、比較側も JST に揃える。
          # ⚠️ ここは意図的に datetime() ではなく date() を使う。
          # admin-ops-c2-constants.test.ts が `datetime('now','+9 hours','-N day')` を
          # **ファイル全体から** 拾って全て FLOW_MEASUREMENT_FRESH_DAYS (=10) と一致することを
          # 要求する (定期便の鮮度窓の drift 検出)。cron ログの窓は無関係な別概念なので、
          # その sweep を弱めずに済むよう構文を分けている。
          # ran_at は ISO 前方一致なので date() の 'YYYY-MM-DD' との字句比較で正しく効く。
          echo '### 1. 直近7日の job × status 件数 (件数のみ)' >> "$GITHUB_STEP_SUMMARY"
          D1 "SELECT job_name, status, COUNT(*) AS n, MAX(ran_at) AS last_at FROM cron_run_logs WHERE ran_at >= date('now','+9 hours','-7 day') AND status IN ('error','partial') GROUP BY job_name, status ORDER BY n DESC"

          echo '### 2. ai-models-catalog-sync の直近10件 (error_summary/metrics_json 実物)' >> "$GITHUB_STEP_SUMMARY"
          D1 "SELECT ran_at, status, error_summary, metrics_json FROM cron_run_logs WHERE job_name='ai-models-catalog-sync' ORDER BY ran_at DESC LIMIT 10"

          echo '### 3. Cloudflare AI models API 外形 probe (workflow 側 token・HTTP と件数のみ)' >> "$GITHUB_STEP_SUMMARY"
          # worker が叩くのと同じ URL/クエリ。token は workflow 側 (deploy 用) なので
          # worker の secret とは別物 — ここが 200 なら「endpoint と account は健全」が確定し、
          # 原因は worker 側 (token 権限 or 実装) に絞れる。
          HTTP=$(curl -s -o /tmp/aimodels.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/models/search?per_page=200")
          SUCCESS=$(node -e "try{const d=require('/tmp/aimodels.json');console.log(d.success)}catch(e){console.log('parse-error')}")
          COUNT=$(node -e "try{const d=require('/tmp/aimodels.json');console.log(Array.isArray(d.result)?d.result.length:'not-array')}catch(e){console.log('parse-error')}")
          NAMED=$(node -e "try{const d=require('/tmp/aimodels.json');const r=Array.isArray(d.result)?d.result:[];console.log(r.filter(m=>m&&m.name).length)}catch(e){console.log('parse-error')}")
          ERRCODES=$(node -e "try{const d=require('/tmp/aimodels.json');console.log(JSON.stringify((d.errors||[]).map(e=>e&&e.code)))}catch(e){console.log('parse-error')}")
          {
            echo "- http_status: \`${HTTP}\`"
            echo "- success: \`${SUCCESS}\`"
            echo "- result_len: \`${COUNT}\` / name を持つ件数: \`${NAMED}\`"
            echo "- error codes: \`${ERRCODES}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          {
            echo '### 読み方'
            echo '- 2 の error_summary が `Cloudflare API returned 403` → worker の token 権限不足 (Workers AI read を付与 / ダッシュボードで確認)'
            echo '- 2 が `Cloudflare API returned 404` かつ 3 が 200 → worker の CLOUDFLARE_ACCOUNT_ID が別値'
            echo '- 2 が `Cloudflare API success=false` → API 側のエラー (3 の error codes と突き合わせ)'
            echo '- 2 が `Illegal invocation...` → 実装バグ (global fetch を object property 経由で呼んでいる)'
            echo '- 3 が 200 かつ result_len > 0 なのに 2 が error → 原因は worker 側に確定'
          } >> "$GITHUB_STEP_SUMMARY"

      # ポータル bootstrap 一括 read (Ultraplan PR-3, #258) の gate 開放。
      # 前提: PR-3 のコード (bootstrapPortal) が本番に deploy 済みであること。未 deploy のまま
      # ON にしても旧 HTML には配線が無く無害だが「flip したのに変わらない」誤診を生むので、
      # 本番 HTML を機械チェックしてから投入する。投入後は gate-on HTML の伝播を実測し、
      # liff-health (打ち切り/parse/watchdog) まで通してから成功にする。
      - name: Enable portal bootstrap (PORTAL_BOOTSTRAP_ENABLED=true)
        if: inputs.op == 'enable-portal-bootstrap'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL='https://naturism-line-crm.katsu-7d5.workers.dev'
          # ⚠️ pipefail 下で `curl | grep -q` を書かないこと: grep -q は match した瞬間に
          # pipe を閉じ、curl が exit 23 (write failure) になり **match していても** pipeline が
          # 失敗する (2026-08-20 の初回 flip run 実発生)。一時ファイル経由で分離する。
          HTML="$RUNNER_TEMP/portal.html"
          curl -sS --max-time 20 -o "$HTML" "$URL/liff/portal" || true
          if ! grep -q 'bootstrapPortal' "$HTML" 2>/dev/null; then
            echo '❌ 本番 /liff/portal に bootstrapPortal がありません — PR-3 (#258) を先に deploy してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          TMP="$RUNNER_TEMP/secrets.portal-bootstrap.json"
          printf '{"PORTAL_BOOTSTRAP_ENABLED":"true"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          echo '### Secrets (names only)' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list >> "$GITHUB_STEP_SUMMARY"
          # 伝播待ち: secret 投入は新 version を作る。gate-on HTML (PORTAL_BOOTSTRAP_ON = true) が
          # 実際に配られるまで 5s × 12 リトライで実測する (post-deploy-check と同じ流儀)。
          FOUND=0
          for i in $(seq 1 12); do
            curl -sS --max-time 20 -o "$HTML" "$URL/liff/portal" || true
            if grep -q 'PORTAL_BOOTSTRAP_ON = true' "$HTML" 2>/dev/null; then
              echo "✅ gate-on HTML を確認 (attempt $i)" | tee -a "$GITHUB_STEP_SUMMARY"
              FOUND=1
              break
            fi
            sleep 5
          done
          if [ "$FOUND" != "1" ]; then
            echo '❌ 60s 待っても gate-on HTML が配られていません — 伝播遅延か投入失敗。secret-list で確認のうえ再実行してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # gate-on の本番 HTML を liff-health (打ち切り / parse / watchdog 配置) まで検証
          node ../../scripts/liff-health-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          echo '⚠️ これ以降、ポータル初期化は bootstrap 1 往復で走ります。実機でリクエスト数 2-3 本 (portal-bootstrap + intake/streak ± referral/generate) を確認してください。異常時は disable-portal-bootstrap で即時 OFF (redeploy 不要)。' >> "$GITHUB_STEP_SUMMARY"

      # 上記 gate の即時 kill switch (redeploy 不要)。OFF = client は従来の個別 fetch 経路へ戻る。
      - name: Disable portal bootstrap (PORTAL_BOOTSTRAP_ENABLED=false)
        if: inputs.op == 'disable-portal-bootstrap'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/secrets.portal-bootstrap.json"
          printf '{"PORTAL_BOOTSTRAP_ENABLED":"false"}' > "$TMP"
          npx wrangler secret bulk "$TMP"
          rm -f "$TMP"
          URL='https://naturism-line-crm.katsu-7d5.workers.dev'
          # pipefail 下の `curl | grep -q` 禁止 (enable 側のコメント参照)
          HTML="$RUNNER_TEMP/portal.html"
          FOUND=0
          for i in $(seq 1 12); do
            curl -sS --max-time 20 -o "$HTML" "$URL/liff/portal" || true
            if grep -q 'PORTAL_BOOTSTRAP_ON = false' "$HTML" 2>/dev/null; then
              echo "✅ gate-off HTML を確認 (attempt $i)" | tee -a "$GITHUB_STEP_SUMMARY"
              FOUND=1
              break
            fi
            sleep 5
          done
          if [ "$FOUND" != "1" ]; then
            echo '❌ 60s 待っても gate-off HTML が配られていません — 伝播遅延か投入失敗。secret-list で確認のうえ再実行してください' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
